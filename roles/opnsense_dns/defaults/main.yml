---
# OPNsense DNS role defaults

# Domain for this substrate. No default on purpose: a site literal here means a
# site without an override silently publishes into the other site's zone, which
# is what this role did when it defaulted to dvntm.deevnet.net. Set it in the
# site's group_vars/routers.
dns_domain: ""

# Description prefix for Ansible-managed records
dns_description_prefix: "Ansible managed"

# TTL for DNS records (seconds)
dns_record_ttl: 300

# OPNsense API settings
opnsense_api_url: "https://{{ ansible_host }}/api"
opnsense_validate_certs: false

# Reconciliation
# ------------------------------------------------------------------------------
# Removes records this role manages that inventory no longer declares - the
# other half of reconciliation, without which a renamed host keeps its old
# record forever alongside the new one.
#
# Off by default: it is the only destructive step in the role, so it is opted
# into per run. It only ever considers records carrying dns_description_prefix
# in this role's own dns_domain, so hand-made GUI records and other zones are
# never candidates.
dns_delete_unmanaged: false

# Unbound self-registration
# ------------------------------------------------------------------------------
# Unbound publishes names of its own unless told not to, and by default it does.
# That made it a second writer to the same zone: every host ended up with a
# duplicate record beside the one this role manages, and the router acquired one
# A record per VLAN interface on a name the service CNAMEs resolve through.
#
# Inventory is the single source of these names, so all three registration paths
# are off. Turning one back on means accepting a second writer.
dns_register_system_records: false
dns_register_dhcp_static: false
dns_register_dhcp_leases: false

# Where registration would publish, if it were ever turned back on. Follows this
# role's own zone rather than the firewall's system domain, which is what the
# empty default falls back to - and the reason the duplicates landed in
# `deevnet.net` instead of on top of the real records.
dns_dhcp_registration_domain: "{{ dns_domain }}"

# Tenant zone delegation is the Deevnet API's (ADR-0015 §6), not this role's:
# it knows a tenant's index, and therefore which reverse zone to delegate. The
# endpoint notes below are kept because they were expensive to establish and the
# API's OPNsense backend speaks to the same endpoints.

# Unbound query-forwarding endpoints, verified against OPNsense 25.7.10.
#
# These rows are NOT in unbound/settings/get - that payload has no `domains`
# collection, which is what an earlier version of this role looked for and why
# it delegated nothing while appearing to work. They have their own endpoints,
# and the request body is wrapped in `dot`: one model backs both DNS-over-TLS
# and plain forward rows, selected by `type`.
#
# Kept as variables so a future model rename is a defaults edit rather than a
# task rewrite; the role asserts the search endpoint answers before reconciling.
dns_forward_search_endpoint: searchForward
dns_forward_add_endpoint: addForward
dns_forward_set_endpoint: setForward
dns_forward_wrapper: dot

# Host records will be built from inventory
dns_host_records: []

# Service CNAMEs (defined in group_vars/routers.yml)
dns_service_records: []
