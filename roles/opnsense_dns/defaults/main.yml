---
# OPNsense DNS role defaults

# Domain for this substrate
dns_domain: "dvntm.deevnet.net"

# Description prefix for Ansible-managed records
dns_description_prefix: "Ansible managed"

# TTL for DNS records (seconds)
dns_record_ttl: 300

# OPNsense API settings
opnsense_api_url: "https://{{ ansible_host }}/api"
opnsense_validate_certs: false

# Tenant zone delegation (ADR-0004)
# ------------------------------------------------------------------------------
# Tenant records are NOT held here. Unbound forwards each tenant zone to the
# authoritative server that does hold them, so a substrate reconciliation - this
# role, including dns_delete_unmanaged - cannot reach tenant content.
dns_tenant_delegation_enabled: true

# Where the tenant zones are served. Resolved from the tenant_dns group rather
# than written as a literal: ADR-0004 expects the service to move hosts
# eventually, and consumers should follow it without an edit here.
dns_tenant_server: >-
  {{ hostvars[groups['tenant_dns'] | first].env.interfaces.eth0.ip
     if (groups['tenant_dns'] | default([]) | length > 0)
     else '' }}

# Unbound query-forwarding endpoints, verified against OPNsense 25.7.10.
#
# These rows are NOT in unbound/settings/get - that payload has no `domains`
# collection, which is what an earlier version of this role looked for and why
# it delegated nothing while appearing to work. They have their own endpoints,
# and the request body is wrapped in `dot`: one model backs both DNS-over-TLS
# and plain forward rows, selected by `type`.
#
# Kept as variables so a future model rename is a defaults edit rather than a
# task rewrite; the role asserts the search endpoint answers before reconciling.
dns_forward_search_endpoint: searchForward
dns_forward_add_endpoint: addForward
dns_forward_set_endpoint: setForward
dns_forward_wrapper: dot

# Host records will be built from inventory
dns_host_records: []

# Service CNAMEs (defined in group_vars/routers.yml)
dns_service_records: []
