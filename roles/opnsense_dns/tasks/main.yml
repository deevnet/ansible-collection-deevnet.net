---
# Main entry point for opnsense_dns role

- name: Gather DNS records from inventory
  ansible.builtin.include_tasks: gather_hosts.yml

# Before the host overrides, not after: this stops Unbound publishing its own
# copy of the estate, so the records written below are the only ones in the
# zone rather than the second set to arrive.
- name: Stop Unbound publishing names of its own
  ansible.builtin.include_tasks:
    file: configure_registration.yml
    apply:
      tags: [registration]
  tags: [registration]

- name: Configure Unbound host overrides
  ansible.builtin.include_tasks: configure_unbound.yml

# Tenant zone delegation is NOT here any more. The Deevnet API adds the Unbound
# query-forwarding entry for a tenant's forward and reverse zones when it admits
# the tenant (ADR-0015 §6), because it is the thing that knows the tenant's index
# and therefore which reverse zone to delegate. Doing it from inventory as well
# meant one object with two sources and two registries that drift - retired in
# CHG-0010 step 11.
#
# Nothing here prunes forward entries, so the API's survive this role untouched;
# dns_delete_unmanaged reaches host overrides and aliases only.
