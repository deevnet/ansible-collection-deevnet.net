---
# Configure switch management identity: hostname and default gateway
#
# Reads gateway from env.interfaces.eth0.gateway in host_vars.
# Only runs if the gateway is defined.

# Hostname
# -----------------------------------------------------------------------------
# The one task in this role that is NOT unconditionally `changed`. Everything
# else here writes flash on every run via the `write memory` handler, which is
# tolerable for config that is being actively driven but not for a name that
# changes once in the life of the switch.
#
# The switch renders it quoted - `hostname "dv02acc001p01"` - so a substring
# test for `hostname <name>` never matches and would set the name, and write
# flash, on every single run. Parse the value out and compare it instead.

- name: Read the running configuration
  ansible.netcommon.cli_command:
    command: "show running-config"
  register: _switch_running_config
  changed_when: false

- name: Determine the switch's current hostname
  ansible.builtin.set_fact:
    _switch_current_hostname: >-
      {{ (_switch_running_config.stdout
          | regex_search('(?im)^\s*hostname\s+"?([^"\r\n]+?)"?\s*$', '\1')
          | default([], true) | first | default('', true)) | trim }}

- name: Set the system hostname
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop:
    - "configure"
    - "hostname {{ switch_hostname }}"
    - "end"
  when: _switch_current_hostname != switch_hostname
  changed_when: true
  notify: write memory

- name: Set default gateway
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop:
    - "configure"
    - "ip route 0.0.0.0 0.0.0.0 {{ env.interfaces.eth0.gateway }}"
    - "end"
  when: env.interfaces.eth0.gateway is defined
  changed_when: true
  notify: write memory
