---
# Configure OPNsense Kea DHCP static reservations via API
#
# Strategy:
#   1. Fetch current reservations from Kea DHCP API
#   2. Build mapping of MAC -> UUID for existing reservations
#   3. For each desired reservation:
#      - If MAC exists with different hostname/IP: update via set_reservation
#      - If MAC does not exist: add via add_reservation
#   4. For MACs marked for removal: delete via del_reservation
#   5. Reconfigure DHCP service to apply changes
#
# This role is not the only writer. The Deevnet API keeps tenants' device
# address reservations in the same table (ADR-0035), described
# "Deevnet API - <tenant>/<device>". The description is what keeps the two
# apart: this role writes, updates and deletes only rows that carry
# dhcp_description_prefix, and stops rather than take over a row that does not.

# Step 1: Get current Kea DHCP reservations
- name: Get current DHCP reservations
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/kea/dhcpv4/search_reservation"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body: {}
    return_content: true
  register: dhcp_reservations
  delegate_to: localhost
  check_mode: false  # read-only query; must run so --check can compute a diff

- name: Display current reservations count
  ansible.builtin.debug:
    msg: "Found {{ dhcp_reservations.json.rows | default([]) | length }} existing DHCP reservations"

# Step 2: Build MAC -> existing reservation mapping
- name: Build MAC to reservation UUID mapping
  ansible.builtin.set_fact:
    existing_maps_by_mac: >-
      {{
        existing_maps_by_mac | default({}) | combine({
          (item.hw_address | upper): {
            'uuid': item.uuid,
            'ip': item.ip_address | default(''),
            'hostname': item.hostname | default(''),
            'description': item.description | default('')
          }
        })
      }}
  loop: "{{ dhcp_reservations.json.rows | default([]) }}"
  loop_control:
    label: "{{ item.hw_address | default('unknown') }}"
  when: item.hw_address is defined

- name: Ensure existing_maps_by_mac is defined
  ansible.builtin.set_fact:
    existing_maps_by_mac: {}
  when: existing_maps_by_mac is not defined

# Step 2b: A MAC inventory declares, already reserved by someone else.
#
# The lookup above is by MAC, so without this the update below would rewrite
# that row - description included - and the prune would then count it as this
# role's. For a tenant's device that means inventory silently taking an address
# the tenant's own state believes it holds. Refusing is the only safe answer:
# either the host does not belong in inventory, or the other reservation has to
# go first, and which is a person's decision.
- name: Find inventory MACs reserved under another owner's description
  ansible.builtin.set_fact:
    reservations_foreign: >-
      {{
        existing_maps_by_mac | dict2items
        | rejectattr('value.description', 'search', '^' ~ (dhcp_description_prefix | regex_escape))
        | selectattr('key', 'in',
            (dhcp_reservations_to_add | map(attribute='mac') | map('upper') | list)
            + (dhcp_macs_to_remove | default([])))
        | list
      }}

- name: Refuse to take over another owner's reservation
  ansible.builtin.assert:
    that: reservations_foreign | length == 0 or (dhcp_adopt_foreign | bool)
    fail_msg: >-
      Inventory declares a host whose MAC is already reserved by something
      other than this role:
      {{ reservations_foreign | map(attribute='key') | zip(reservations_foreign | map(attribute='value.description')) | map('join', ' = ') | list }}.
      A description starting "Deevnet API - " is a tenant's device address
      (ADR-0035): the tenant gives it up, or the host leaves inventory. Any
      other is hand-made: remove it in the router's UI, or re-run with
      -e dhcp_adopt_foreign=true to have this role take it over.

# Step 3: Categorize reservations into add/update
- name: Categorize reservations for processing
  ansible.builtin.set_fact:
    reservations_to_add: >-
      {{
        dhcp_reservations_to_add
        | rejectattr('mac', 'in', existing_maps_by_mac.keys() | list)
        | list
      }}
    reservations_to_update: >-
      {{
        dhcp_reservations_to_add
        | selectattr('mac', 'in', existing_maps_by_mac.keys() | list)
        | list
      }}

- name: Display categorized reservations
  ansible.builtin.debug:
    msg: |
      Reservations to add: {{ reservations_to_add | length }}
      Reservations to check/update: {{ reservations_to_update | length }}
      MACs to remove: {{ dhcp_macs_to_remove | default([]) | length }}

# Step 3b: A host's address moving to another MAC (a NIC or cable swap).
#
# Kea refuses a second reservation for the same address ("Duplicate entry
# exists"), and the prune below runs after the add, so the old row has to go
# first. Only this role's own rows whose MAC inventory no longer declares, and
# only when the address they hold is being reserved again for a new MAC.
- name: Find managed reservations whose address moves to a new MAC
  ansible.builtin.set_fact:
    reservations_superseded: >-
      {{
        existing_maps_by_mac | dict2items
        | selectattr('value.description', 'search', '^' ~ (dhcp_description_prefix | regex_escape))
        | rejectattr('key', 'in', dhcp_reservations_to_add | map(attribute='mac') | map('upper') | list)
        | selectattr('value.ip', 'in', reservations_to_add | map(attribute='ip') | list)
        | list
      }}

- name: Delete reservations whose address moves to a new MAC
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/kea/dhcpv4/del_reservation/{{ item.value.uuid }}"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    status_code: [200, 201]
    return_content: true
  register: _api_del_superseded
  failed_when: >-
    (_api_del_superseded.json | default({})).result | default('') not in ['deleted', 'saved']
  loop: "{{ reservations_superseded }}"
  loop_control:
    label: "Superseded: {{ item.value.hostname | default('') }} {{ item.value.ip }} ({{ item.key }})"
  delegate_to: localhost
  changed_when: true
  notify: reconfigure dhcp

# Without this the prune below would try to delete the same rows again.
- name: Forget the superseded reservations
  ansible.builtin.set_fact:
    existing_maps_by_mac: >-
      {{ existing_maps_by_mac | dict2items
         | rejectattr('key', 'in', reservations_superseded | map(attribute='key') | list)
         | items2dict }}

# Step 4: Add new reservations
- name: Add new DHCP reservations
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/kea/dhcpv4/add_reservation"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body:
      reservation:
        subnet: "{{ item.ip | deevnet.net.dhcp_subnet_for_ip(dhcp_subnet_by_cidr) }}"
        hw_address: "{{ item.mac }}"
        ip_address: "{{ item.ip }}"
        hostname: "{{ item.hostname }}"
        description: "{{ item.description }}"
        option_data:
          tftp_server_name: "{{ item.pxe_tftp_server | default('') }}"
          boot_file_name: "{{ item.pxe_boot_file | default('') }}"
    status_code: [200, 201]
    return_content: true
  failed_when: >-
    (add_results.json | default({})).result | default('') != 'saved'
  loop: "{{ reservations_to_add }}"
  loop_control:
    label: "Adding: {{ item.hostname }} ({{ item.mac }} -> {{ item.ip }})"
  when: reservations_to_add | length > 0
  register: add_results
  delegate_to: localhost
  changed_when: true
  notify: reconfigure dhcp

# Step 5: Update existing reservations whose settings differ from inventory.
#
# Each one is read first and compared with what inventory declares (the same
# kea_diff the subnets use, which reads the subnet field's option list as its
# selected UUID). Only a reservation that differs is written, so a run with
# nothing to change reports nothing changed; this step used to rewrite every
# reservation on every run. hw_address is not compared: it is the key the
# reservation was found by, matched case-insensitively above, and the router
# may hold it in another case. A reservation that differs is sent in full, as
# before.
- name: Read existing reservations inventory declares
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/kea/dhcpv4/get_reservation/{{ existing_maps_by_mac[item.mac].uuid }}"
    method: GET
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    return_content: true
  loop: "{{ reservations_to_update }}"
  loop_control:
    label: "{{ item.hostname }} ({{ item.mac }})"
  register: _res_before
  delegate_to: localhost
  check_mode: false  # read-only query; must run so --check can compute a diff

- name: Work out which reservations differ from inventory
  ansible.builtin.set_fact:
    _res_drift: >-
      {%- set out = [] -%}
      {%- for r in _res_before.results | default([])
            if r.json is defined and r.json.reservation is defined -%}
      {%- set compare = {
            'subnet': r.item.ip | deevnet.net.dhcp_subnet_for_ip(dhcp_subnet_by_cidr),
            'ip_address': r.item.ip,
            'hostname': r.item.hostname,
            'description': r.item.description,
            'option_data': {
              'tftp_server_name': r.item.pxe_tftp_server | default(''),
              'boot_file_name': r.item.pxe_boot_file | default(''),
            },
          } -%}
      {%- set report = compare | deevnet.net.kea_drift_report(r.json.reservation) -%}
      {%- if report | length > 0 -%}
      {%- set _ = out.append({
            'mac': r.item.mac,
            'hostname': r.item.hostname,
            'uuid': existing_maps_by_mac[r.item.mac].uuid,
            'send': compare | combine({'hw_address': r.item.mac}),
            'report': report,
          }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Report reservations that differ from inventory
  ansible.builtin.debug:
    msg: "{{ item.hostname }}: {{ item.report }}"
  loop: "{{ _res_drift }}"
  loop_control:
    label: "{{ item.hostname }}"
  changed_when: true

- name: Update existing DHCP reservations that differ
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/kea/dhcpv4/set_reservation/{{ item.uuid }}"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body:
      reservation: "{{ item.send }}"
    status_code: [200, 201]
    return_content: true
  failed_when: >-
    (update_results.json | default({})).result | default('') != 'saved'
  loop: "{{ _res_drift }}"
  loop_control:
    label: "Updating: {{ item.hostname }}: {{ item.report | join('; ') }}"
  register: update_results
  delegate_to: localhost
  changed_when: true
  notify: reconfigure dhcp

# Step 6: Delete reservations for MACs with dhcp_reservation: false
# Reservations this role manages for hosts inventory no longer declares at all.
# The list above only covers hosts still present that opted out; a host deleted
# outright kept its reservation forever. Guarded like the DNS prune: only
# entries carrying dhcp_description_prefix are candidates, so hand-made GUI
# reservations are never touched.
- name: Identify managed reservations inventory no longer declares
  ansible.builtin.set_fact:
    reservations_undeclared: >-
      {{
        existing_maps_by_mac | dict2items
        | selectattr('value.description', 'defined')
        | selectattr('value.description', 'search', '^' ~ (dhcp_description_prefix | regex_escape))
        | rejectattr('key', 'in', dhcp_reservations_to_add | map(attribute='mac') | map('upper') | list)
        | rejectattr('key', 'in', dhcp_macs_to_remove | default([]))
        | list
      }}

- name: Report reservations that are no longer declared
  ansible.builtin.debug:
    msg: |
      Managed reservations not present in inventory:
      {{ reservations_undeclared | map(attribute='value')
         | map(attribute='hostname') | list | join(', ') | default('none', true) }}
      {{ 'These will be DELETED (dhcp_delete_unmanaged is true).'
         if dhcp_delete_unmanaged | bool
         else 'These are being LEFT IN PLACE. Set dhcp_delete_unmanaged=true to remove them.' }}
  when: reservations_undeclared | length > 0

- name: Delete reservations inventory no longer declares
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/kea/dhcpv4/del_reservation/{{ item.value.uuid }}"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    status_code: [200, 201]
    return_content: true
  register: _api_del_reservation
  failed_when: >-
    (_api_del_reservation.json | default({})).result | default('') not in ['deleted', 'saved']
  loop: "{{ reservations_undeclared }}"
  loop_control:
    label: "Deleting undeclared: {{ item.value.hostname | default(item.key) }} ({{ item.key }})"
  when: dhcp_delete_unmanaged | bool
  delegate_to: localhost
  changed_when: true
  notify: reconfigure dhcp

- name: Delete DHCP reservations marked for removal
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/kea/dhcpv4/del_reservation/{{ existing_maps_by_mac[item].uuid }}"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    status_code: [200, 201]
    return_content: true
  failed_when: >-
    (delete_results.json | default({})).result | default('') not in ['deleted', 'saved']
  loop: "{{ dhcp_macs_to_remove | default([]) }}"
  loop_control:
    label: "Deleting reservation for MAC: {{ item }}"
  when:
    - dhcp_macs_to_remove is defined
    - dhcp_macs_to_remove | length > 0
    - item in existing_maps_by_mac
    # Only this role's own rows, unless told to take another's over above.
    - (existing_maps_by_mac[item].description is search('^' ~ (dhcp_description_prefix | regex_escape)))
      or (dhcp_adopt_foreign | bool)
  register: delete_results
  delegate_to: localhost
  changed_when: true
  notify: reconfigure dhcp

# Step 7: Report completion
- name: Report DHCP configuration results
  ansible.builtin.debug:
    msg: |
      DHCP reservation configuration complete (Kea DHCP):
      - Added: {{ reservations_to_add | length }}
      - Checked for updates: {{ reservations_to_update | length }}, updated: {{ _res_drift | length }}
      - Removed: {{ (delete_results.results | default([]) | selectattr('changed', 'defined') | selectattr('changed') | list | length) | default(0) }}
      - Subnet mappings: {{ dhcp_subnet_by_cidr | length }} subnets
