---
# Main entry point for opnsense_routes role
#
# Ensures the gateways and static routes inventory declares, and nothing else
# unless asked. Input variables:
#   opnsense_gateways / opnsense_static_routes: what to ensure
#   deevnet_vlans: zone definitions, used to resolve a gateway's interface
#   opnsense_api_key / opnsense_api_secret: API credentials

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - opnsense_api_key is defined
      - opnsense_api_key | length > 0
      - opnsense_api_secret is defined
      - opnsense_api_secret | length > 0
    fail_msg: >-
      Required variables missing. Ensure opnsense_api_key and
      opnsense_api_secret are set.

# A gateway whose address is not on the interface it is bound to is accepted by
# OPNsense and then silently does nothing, which is a bad way to find out.
# Catch it here, where the message can say so.
# The containment check below compares network prefixes textually rather than
# with ansible.utils.ipaddr, which needs netaddr on the control node and would
# make this role the only one in the collection to require it. That comparison
# is only correct for a /24, so the zone is asserted to be one first - an
# under-validating check that looks like it works is worse than no check.
- name: Validate each gateway sits in the zone it names
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name | length > 0
      - item.zone is defined and item.zone in deevnet_vlans
      - item.address is defined
      - deevnet_vlans[item.zone].subnet | default('') is match('.*/24$')
      - >-
        (item.address | regex_replace('\.[0-9]+$', ''))
        == (deevnet_vlans[item.zone].subnet | regex_replace('\.[0-9]+/[0-9]+$', ''))
    fail_msg: >-
      Gateway {{ item.name | default('<unnamed>') }} is not usable: address
      {{ item.address | default('<none>') }} must sit in
      {{ deevnet_vlans[item.zone].subnet | default('<unknown zone ' ~ (item.zone | default('?')) ~ '>') }},
      and that zone must be a /24 for this check to mean anything.
    quiet: true
  loop: "{{ opnsense_gateways }}"
  loop_control:
    label: "{{ item.name | default('?') }} -> {{ item.address | default('?') }}"

- name: Validate each route names a network and a gateway
  ansible.builtin.assert:
    that:
      - item.network is defined
      - item.network is match('^[0-9]+(\.[0-9]+){3}/[0-9]{1,2}$')
      - item.gateway is defined and item.gateway | length > 0
    fail_msg: >-
      Static route {{ item.network | default('<none>') }} needs a CIDR network
      such as 10.20.128.0/18, and the name of a gateway.
    quiet: true
  loop: "{{ opnsense_static_routes }}"
  loop_control:
    label: "{{ item.network | default('?') }} via {{ item.gateway | default('?') }}"

- name: Discover OPNsense interface identifiers
  ansible.builtin.include_tasks: discover_interfaces.yml
  when: opnsense_gateways | length > 0

- name: Configure gateways
  ansible.builtin.include_tasks: configure_gateways.yml
  when: opnsense_gateways | length > 0

- name: Configure static routes
  ansible.builtin.include_tasks: configure_routes.yml
  when: opnsense_static_routes | length > 0
