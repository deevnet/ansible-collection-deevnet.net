---
# Ensure declared gateways via /api/routing/settings/
#
#   1. Search existing gateways, keyed by name
#   2. Add the ones that are missing
#   3. Update the ones whose fields differ
#   4. Report any the router holds that inventory does not declare
#
# defaultgw is never sent as anything but '0'. A second default gateway is how
# a router stops routing, and no inventory value should be able to cause that.

- name: Get current gateways
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/routing/settings/searchGateway"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body: {}
    return_content: true
  register: routes_existing_gw
  delegate_to: localhost

- name: Build gateway name to record mapping
  ansible.builtin.set_fact:
    routes_gw_by_name: >-
      {{
        routes_gw_by_name | default({}) | combine({
          (item.name | string): item
        })
      }}
  loop: "{{ routes_existing_gw.json.rows | default([]) }}"
  loop_control:
    label: "{{ item.name | default('?') }}"
  when: item.name is defined

- name: Ensure routes_gw_by_name is defined
  ansible.builtin.set_fact:
    routes_gw_by_name: {}
  when: routes_gw_by_name is not defined

- name: Report existing gateways
  ansible.builtin.debug:
    msg: >-
      {{ routes_gw_by_name | length }} gateway(s) on the router:
      {{ routes_gw_by_name.keys() | list }}

- name: Create missing gateways
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/routing/settings/addGateway"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body:
      gateway_item:
        name: "{{ item.name }}"
        descr: "{{ item.description | default('') }}"
        interface: "{{ routes_zone_to_interface[item.zone] }}"
        ipprotocol: inet
        gateway: "{{ item.address }}"
        defaultgw: "0"
        disabled: "0"
        monitor_disable: "{{ item.monitor_disable | default(opnsense_gateway_monitor_disable) }}"
        priority: "255"
        weight: "1"
    return_content: true
  register: routes_gw_add
  failed_when: >-
    routes_gw_add.status != 200
    or (routes_gw_add.json.result | default('')) != 'saved'
  changed_when: true
  notify:
    - reconfigure gateways
    - reconfigure routes
  loop: "{{ opnsense_gateways }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.address }} on {{ routes_zone_to_interface[item.zone] | default('?') }}"
  when: item.name not in routes_gw_by_name
  delegate_to: localhost

# An existing gateway is corrected only where it differs, so a run that changes
# nothing reports nothing.
- name: Update gateways whose fields differ
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/routing/settings/setGateway/{{ routes_gw_by_name[item.name].uuid }}"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body:
      gateway_item:
        name: "{{ item.name }}"
        descr: "{{ item.description | default('') }}"
        interface: "{{ routes_zone_to_interface[item.zone] }}"
        ipprotocol: inet
        gateway: "{{ item.address }}"
        defaultgw: "0"
        disabled: "0"
        monitor_disable: "{{ item.monitor_disable | default(opnsense_gateway_monitor_disable) }}"
        priority: "255"
        weight: "1"
    return_content: true
  register: routes_gw_set
  failed_when: >-
    routes_gw_set.status != 200
    or (routes_gw_set.json.result | default('')) != 'saved'
  changed_when: true
  notify:
    - reconfigure gateways
    - reconfigure routes
  loop: "{{ opnsense_gateways }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.name in routes_gw_by_name
    - >-
      routes_gw_by_name[item.name].gateway | default('') != item.address
      or routes_gw_by_name[item.name].interface | default('') != routes_zone_to_interface[item.zone]
      or routes_gw_by_name[item.name].descr | default('') != (item.description | default(''))
  delegate_to: localhost

- name: Report gateways the router holds that inventory does not declare
  ansible.builtin.debug:
    msg: >-
      Undeclared gateways, left alone: {{ routes_gw_undeclared }}.
      This role does not delete; remove one at the router if it is unwanted.
  vars:
    routes_gw_undeclared: >-
      {{ routes_gw_by_name.keys() | difference(opnsense_gateways | map(attribute='name') | list) | list }}
  when: routes_gw_undeclared | length > 0
