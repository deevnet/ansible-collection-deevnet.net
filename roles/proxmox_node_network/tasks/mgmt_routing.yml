---
# Install the source-based routing unit for the management address.
#
# Delivered as a systemd unit rather than through the PVE network API, because
# that API models interfaces only - it has no field for post-up hooks or extra
# routing tables. Dropping a second stanza for the bridge into
# /etc/network/interfaces.d/ would collide with the one the API owns, so a unit
# keeps the two from fighting over the same file.
#
# This is the one part of the role that needs SSH to the hypervisor; everything
# else goes through the API.

- name: Resolve the management address and its gateway
  ansible.builtin.set_fact:
    _mgmt_ip: "{{ proxmox_node_network.mgmt.cidr | ansible.utils.ipaddr('address') }}"
    _mgmt_gateway: >-
      {{ proxmox_node_network.mgmt.routing_gateway
         | default(env.interfaces.eth0.gateway, true)
         | default(deevnet_vlans.management.gateway, true) }}

- name: Assert the management gateway resolved
  ansible.builtin.assert:
    that:
      - _mgmt_ip | length > 0
      - _mgmt_gateway | length > 0
    fail_msg: >-
      Could not resolve the management address/gateway for the routing unit.
      Set proxmox_node_network.mgmt.cidr and either
      proxmox_node_network.mgmt.routing_gateway or
      deevnet_vlans.management.gateway.

- name: Install the management routing unit
  ansible.builtin.template:
    src: deevnet-mgmt-routing.service.j2
    dest: "/etc/systemd/system/{{ proxmox_mgmt_routing_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart mgmt routing

- name: Enable and start the management routing unit
  ansible.builtin.systemd_service:
    name: "{{ proxmox_mgmt_routing_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Record that the routing unit is managed on this host
  ansible.builtin.set_fact:
    _mgmt_routing_installed: true

- name: Verify the policy rule is in place
  ansible.builtin.command: "ip rule show from {{ _mgmt_ip }}"
  register: _ip_rule
  changed_when: false
  become: true

- name: Assert the policy rule took effect
  ansible.builtin.assert:
    that:
      - "'lookup ' ~ proxmox_mgmt_routing.table in _ip_rule.stdout"
    fail_msg: >-
      The source-based routing rule for {{ _mgmt_ip }} is not present. Do NOT
      run the default-route tag until this is working, or the node will only
      be reachable from its own management subnet.
    success_msg: "Policy rule active: {{ _ip_rule.stdout | trim }}"
