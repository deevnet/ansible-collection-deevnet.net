---
# opnsense_firewall role defaults

# OPNsense API settings (typically inherited from group_vars/routers.yml)
opnsense_api_url: "https://{{ ansible_host }}/api"
opnsense_validate_certs: false

# Prefix for managed rule descriptions (used for idempotency)
firewall_managed_prefix: "ansible:"

# Anti-lockout: always allow management subnet to router on 443/22
firewall_anti_lockout: true

# Sequence numbering for rule ordering
firewall_sequence_start: 100
firewall_sequence_step: 10

# Expected from inventory
firewall_zone_policies: []
firewall_internet_zones: []

# VLAN definitions — expected from group_vars/all/vlans.yml
# deevnet_vlans: {}

# --- Safety ------------------------------------------------------------------
# This role reconciles by subtraction: anything managed that inventory no longer
# declares becomes a deletion candidate. That is only safe while the desired set
# is trustworthy, and on 2026-09-07 it was not - a broken discovery produced an
# empty desired set, every rule became undeclared, and the reconcile removed the
# whole policy including the anti-lockout rules. The guards below exist so that
# cannot be expressed again.

# Deletion is opt-in, matching opnsense_dns (dns_delete_unmanaged) and
# opnsense_dhcp (dhcp_delete_unmanaged). This role was the only one of the three
# without the gate, and the only one whose deletions remove the path used to
# reach the router. Left false, undeclared rules are reported and kept.
firewall_delete_unmanaged: false

# Never deletion candidates, whatever else changes. These are the rules that
# carry the operator's and the automation host's own path to the router: remove
# them and the only way back is the physical console.
#
# The two anti-lockout rules are generated by this role, so they are protected
# by default. A site whose operators reach the management plane from another
# segment should add that policy's description here too - on the mobile
# substrate that is "<prefix> trusted -> management".
firewall_protected_descriptions:
  - "{{ firewall_managed_prefix }} anti-lockout HTTPS management"
  - "{{ firewall_managed_prefix }} anti-lockout SSH management"

# --- Apply and verify --------------------------------------------------------

# Use OPNsense's rollback savepoint for the apply, so a change that severs the
# control host is reverted by the router itself rather than by a person with a
# console cable. Probed at run time: builds without the endpoint fall back to a
# plain apply and say so.
firewall_use_savepoint: true

# Seconds the router waits for cancelRollback before reverting on its own. Must
# comfortably exceed the reachability check below.
firewall_savepoint_timeout: 120

# After applying, prove from the control host that the paths which matter still
# work. Failure leaves the savepoint uncancelled - which IS the rollback.
firewall_verify_reachability: true
firewall_reachability_timeout: 10

# Defaults to the router's own management ports, which the anti-lockout rules
# exist to keep open. Sites should add a host on each policy-bearing segment.
firewall_reachability_targets:
  - host: "{{ ansible_host }}"
    port: 443
    why: "router web UI from the control host"
  - host: "{{ ansible_host }}"
    port: 22
    why: "router SSH from the control host"
