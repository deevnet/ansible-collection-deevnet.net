---
# Configure OPNsense firewall filter rules via API
#
# Strategy:
#   1. Fetch current rules from the filter API
#   2. Index the managed rules, keeping every row - descriptions are not unique
#   3. Build desired rules from zone policies, internet zones, gateway services
#      and anti-lockout
#   4. Categorize into add / update / delete, with field-level differences
#   5. REPORT everything (always), and execute only when firewall_apply is true
#   6. Notify the handler to apply
#
# The role reports by default and writes nothing. `--check` is not a dry run
# here - ansible.builtin.uri declares check_mode support: none, so Ansible skips
# every writing task and a clean check run reads as "nothing to change" whatever
# the real run would do. That silence preceded INC-0001. firewall_apply is the
# dry run.

# Step 1: Fetch current firewall rules
- name: Get current firewall rules
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/firewall/filter/searchRule"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body:
      current: 1
      rowCount: -1
      sort: {}
      searchPhrase: "{{ firewall_managed_prefix }}"
    return_content: true
  register: current_rules
  changed_when: false
  delegate_to: localhost

# Step 2: Index the managed rules
#
# Descriptions are NOT unique on the router. On 2026-09-19 the live table held
# 25 managed rules under 13 distinct descriptions - twelve `temp-allow-all-optN`
# entries present twice each, plus one `test-rule`. A description-keyed dict
# therefore loses one row of every pair, and a reconcile built from it would
# have deleted 13 rules and left 12 allow-all rules quietly in place. Keep every
# row; index by description only for the update comparison.
- name: Select the managed rules from the router's rule table
  ansible.builtin.set_fact:
    _fw_managed_rows: >-
      {{ current_rules.json.rows | default([])
         | selectattr('description', 'defined')
         | selectattr('description', 'match', firewall_managed_prefix ~ '.*')
         | list }}

- name: Report what the router is holding
  ansible.builtin.debug:
    msg: >-
      Found {{ _fw_managed_rows | length }} managed rules on the router under
      {{ _fw_managed_rows | map(attribute='description') | unique | list | length }}
      distinct descriptions
      ({{ current_rules.json.rows | default([]) | length }} rows returned in total).

# dict() over reversed rows: later keys win, so reversing makes the FIRST
# occurrence of each description the one that survives. Everything else is a
# duplicate and becomes a deletion candidate below.
- name: Index the managed rules by description, first occurrence winning
  ansible.builtin.set_fact:
    existing_rules_by_desc: >-
      {{ dict(_fw_managed_rows | reverse | list | map(attribute='description') | list
              | zip(_fw_managed_rows | reverse | list)) }}

# Step 3: Build desired rules list
- name: Initialize desired rules
  ansible.builtin.set_fact:
    desired_rules: []
    _seq: "{{ firewall_sequence_start | int }}"

# Step 3a: Anti-lockout rules (management subnet -> router on 443, 22)
- name: Build anti-lockout rules
  ansible.builtin.set_fact:
    desired_rules: "{{ desired_rules + _anti_lockout_rules }}"
    _seq: "{{ _seq | int + (firewall_sequence_step | int * 2) }}"
  vars:
    _mgmt_iface: "{{ zone_to_interface['management'].identifier | default('') }}"
    _mgmt_subnet: "{{ deevnet_vlans['management'].subnet | default('') }}"
    _anti_lockout_rules:
      - description: "{{ firewall_managed_prefix }} anti-lockout HTTPS management"
        interface: "{{ _mgmt_iface }}"
        direction: "in"
        action: "pass"
        protocol: "TCP"
        source_net: "{{ _mgmt_subnet }}"
        destination_net: "{{ _mgmt_iface }}ip"
        destination_port: "443"
        sequence: "{{ _seq | int }}"
      - description: "{{ firewall_managed_prefix }} anti-lockout SSH management"
        interface: "{{ _mgmt_iface }}"
        direction: "in"
        action: "pass"
        protocol: "TCP"
        source_net: "{{ _mgmt_subnet }}"
        destination_net: "{{ _mgmt_iface }}ip"
        destination_port: "22"
        sequence: "{{ _seq | int + firewall_sequence_step | int }}"
  when:
    - firewall_anti_lockout | bool
    - "'management' in zone_to_interface"

# Step 3b: Gateway services - each zone reaches its OWN gateway for DNS and DHCP
#
# These replace the per-interface conntrack rules, which described an intent the
# router never received (`quick` and `state` were built but never sent) and were
# redundant anyway - pf creates state on a passing rule by default.
#
# The gap they were hiding is real, and it is why these rules exist: the router
# generates nothing that lets a VLAN client reach its gateway's DNS or DHCP
# server. Its only automatic DHCP rules are the client rules on WAN. Observed on
# the rule listing, 2026-09-14, not from vendor documentation. Without these,
# removing allow-all takes DNS away from every zone - including the control host,
# whose resolver IS 10.20.99.1 - and every DHCP lease with it.
#
# Read off the router on 2026-09-19, so neither is a guess:
#   - `protocol` accepts "TCP/UDP" as one value, so DNS is one rule, not two.
#   - `<identifier>ip` (opt4ip, opt8ip, lanip ...) is a valid destination, as is
#     `any`; both appear in firewall/filter/listNetworkSelectOptions.
#
# Source is `any`, not the zone subnet. An inbound interface rule is already
# scoped by the interface it sits on, and `any` is what makes these work for the
# two cases a subnet source would break: DHCP discovery, which has no lease and
# so no in-subnet source address, and tenant overlay traffic arriving on
# tenant_transit from 10.20.128.0/18 rather than from 10.20.50.0/24.
#
# DHCP's destination is `any`, not the interface address: DISCOVER is sent to
# 255.255.255.255, which no interface-address rule would match.
- name: Build gateway service rules for each zone
  ansible.builtin.set_fact:
    desired_rules: "{{ desired_rules + [_dns_rule] + ([_dhcp_rule] if _dhcp else []) }}"
    _seq: "{{ _seq | int + (firewall_sequence_step | int * (2 if _dhcp else 1)) }}"
  vars:
    _iface: "{{ zone_to_interface[item.key].identifier | default('') }}"
    _dhcp: "{{ deevnet_vlans[item.key].dhcp_enabled | default(true) | bool }}"
    _dns_rule:
      description: "{{ firewall_managed_prefix }} gateway services DNS {{ item.key }}"
      interface: "{{ _iface }}"
      direction: "in"
      action: "pass"
      protocol: "TCP/UDP"
      source_net: "any"
      destination_net: "{{ _iface }}ip"
      destination_port: "53"
      sequence: "{{ _seq | int }}"
    _dhcp_rule:
      description: "{{ firewall_managed_prefix }} gateway services DHCP {{ item.key }}"
      interface: "{{ _iface }}"
      direction: "in"
      action: "pass"
      protocol: "UDP"
      source_net: "any"
      destination_net: "any"
      destination_port: "67"
      sequence: "{{ _seq | int + firewall_sequence_step | int }}"
  loop: "{{ zone_to_interface | dict2items }}"
  loop_control:
    label: "gateway services: {{ item.key }}{{ ' (DNS+DHCP)' if _dhcp else ' (DNS)' }}"
  when:
    - _iface | length > 0
    - item.key in deevnet_vlans
    - deevnet_vlans[item.key].gateway is defined

# Step 3c: Zone policy rules from firewall_zone_policies
- name: Build zone policy rules
  ansible.builtin.set_fact:
    desired_rules: "{{ desired_rules + [_policy_rule] }}"
    _seq: "{{ _seq | int + firewall_sequence_step | int }}"
  vars:
    _from_iface: "{{ zone_to_interface[item.from_zone].identifier | default('') }}"
    _from_subnet: "{{ deevnet_vlans[item.from_zone].subnet | default('') }}"
    _to_subnet: "{{ deevnet_vlans[item.to_zone].subnet | default('') }}"
    # A zone pair is the usual grain, and then every field comes from the zones.
    # An entry may narrow any of them - one host to one port rather than a whole
    # segment - and must then carry a `name`, because the description is the key
    # this role reconciles on and two entries for the same pair would otherwise
    # be the same rule.
    _policy_rule:
      description: >-
        {{ firewall_managed_prefix }} {{ item.from_zone }} -> {{ item.to_zone }}{{
          (': ' ~ item.name) if item.name is defined else '' }}
      interface: "{{ _from_iface }}"
      direction: "in"
      action: "{{ item.action | default('pass') }}"
      protocol: "{{ item.protocol | default('any', true) }}"
      source_net: "{{ item.source_net | default(_from_subnet, true) }}"
      destination_net: "{{ item.destination_net | default(_to_subnet, true) }}"
      destination_port: "{{ item.destination_port | default('') }}"
      sequence: "{{ _seq | int }}"
  loop: "{{ firewall_zone_policies }}"
  loop_control:
    label: "{{ item.from_zone }} -> {{ item.to_zone }}"
  when:
    - item.from_zone in zone_to_interface
    - item.to_zone in deevnet_vlans
    - _from_iface | length > 0
    - _from_subnet | length > 0
    - _to_subnet | length > 0

# Step 3d: Internet access rules for firewall_internet_zones
- name: Build internet access rules
  ansible.builtin.set_fact:
    desired_rules: "{{ desired_rules + [_inet_rule] }}"
    _seq: "{{ _seq | int + firewall_sequence_step | int }}"
  vars:
    _iface: "{{ zone_to_interface[item].identifier | default('') }}"
    _subnet: "{{ deevnet_vlans[item].subnet | default('') }}"
    _inet_rule:
      description: "{{ firewall_managed_prefix }} {{ item }} -> internet"
      interface: "{{ _iface }}"
      direction: "in"
      action: "pass"
      protocol: "any"
      source_net: "{{ _subnet }}"
      destination_net: "!10.20.0.0/16"
      destination_port: ""
      sequence: "{{ _seq | int }}"
  loop: "{{ firewall_internet_zones | default([]) }}"
  loop_control:
    label: "internet: {{ item }}"
  when:
    - item in zone_to_interface
    - _iface | length > 0
    - _subnet | length > 0

# The second half of the guard in discover_interfaces.yml. Discovery can succeed
# while the desired set still comes out empty - an inventory with no policies, a
# filtered loop, a variable that did not reach the role. Whatever the cause, a
# run that wants zero rules on a router that has rules is a wipe, and it is not
# something to do unattended.
- name: Assert the desired policy is not empty
  ansible.builtin.assert:
    that:
      - desired_rules | length > 0
    fail_msg: >-
      Built 0 desired rules from {{ firewall_zone_policies | length }} declared
      policies and {{ zone_to_interface | length }} mapped zones. Refusing:
      applying an empty policy would make every existing managed rule a deletion
      candidate. Check that firewall_zone_policies and deevnet_vlans reached the
      role.
    success_msg: "Built {{ desired_rules | length }} desired rules."

# A leading "!" is the web UI's syntax for a negated network. The API does not
# take it - it answers `{"result":"failed"}` with
# `'!10.20.0.0/16 is not a valid source IP address or alias.'` - and expects the
# separate source_not / destination_not booleans instead. Inventory may write
# either form; this is where the two meet.
- name: Normalise negated networks into the API's not fields
  ansible.builtin.set_fact:
    _fw_normalised: >-
      {{ _fw_normalised | default([]) + [ item | combine({
           'source_net': _src | regex_replace('^!', ''),
           'source_not': '1' if _src.startswith('!') else '0',
           'destination_net': _dst | regex_replace('^!', ''),
           'destination_not': '1' if _dst.startswith('!') else '0'
         }) ] }}
  vars:
    _src: "{{ item.source_net | default('any', true) }}"
    _dst: "{{ item.destination_net | default('any', true) }}"
  loop: "{{ desired_rules }}"
  loop_control:
    label: "{{ item.description }}"

- name: Adopt the normalised rules
  ansible.builtin.set_fact:
    desired_rules: "{{ _fw_normalised | default([]) }}"

# Step 4: Categorize, with field-level differences
- name: Split the desired rules into new and already present
  ansible.builtin.set_fact:
    rules_to_add: >-
      {{ desired_rules
         | rejectattr('description', 'in', existing_rules_by_desc.keys() | list)
         | list }}
    _fw_rules_present: >-
      {{ desired_rules
         | selectattr('description', 'in', existing_rules_by_desc.keys() | list)
         | list }}
    _fw_rule_diffs: []

# The comparison is built once, here, and drives both the report and the update
# task's condition - so the plan cannot disagree with what an apply would do.
#
# The router returns `any` for an unset protocol, source or destination, and ''
# for an unset port. The role used to send '' for the first three and compare
# against '', which made every rule read as changed on every run. It also stored
# `ipprotocol` under the key `protocol`, so the real protocol was never compared
# at all.
- name: Compare each declared rule with the router's copy
  ansible.builtin.set_fact:
    _fw_rule_diffs: >-
      {{ _fw_rule_diffs + ([{
           'description': item.description,
           'uuid': _live.uuid,
           'fields': _changed
         }] if _changed | length > 0 else []) }}
  vars:
    _live: "{{ existing_rules_by_desc[item.description] }}"
    _changed: >-
      {{ [
           ({'field': 'enabled', 'from': _live.enabled | default('0') | string, 'to': '1'}
            if (_live.enabled | default('0') | string) != '1' else None),
           ({'field': 'action', 'from': _live.action | default(''), 'to': item.action}
            if (_live.action | default('')) != item.action else None),
           ({'field': 'interface', 'from': _live.interface | default(''), 'to': item.interface}
            if (_live.interface | default('')) != item.interface else None),
           ({'field': 'direction', 'from': _live.direction | default(''), 'to': item.direction}
            if (_live.direction | default('')) != item.direction else None),
           ({'field': 'protocol', 'from': _live.protocol | default('any'), 'to': item.protocol}
            if (_live.protocol | default('any')) != item.protocol else None),
           ({'field': 'source_net', 'from': _live.source_net | default('any'), 'to': item.source_net}
            if (_live.source_net | default('any')) != item.source_net else None),
           ({'field': 'destination_net', 'from': _live.destination_net | default('any'), 'to': item.destination_net}
            if (_live.destination_net | default('any')) != item.destination_net else None),
           ({'field': 'source_not', 'from': _live.source_not | default('0') | string, 'to': item.source_not | default('0')}
            if (_live.source_not | default('0') | string) != (item.source_not | default('0')) else None),
           ({'field': 'destination_not', 'from': _live.destination_not | default('0') | string, 'to': item.destination_not | default('0')}
            if (_live.destination_not | default('0') | string) != (item.destination_not | default('0')) else None),
           ({'field': 'destination_port', 'from': _live.destination_port | default(''), 'to': item.destination_port}
            if (_live.destination_port | default('')) != item.destination_port else None)
         ] | reject('none') | list }}
  loop: "{{ _fw_rules_present }}"
  loop_control:
    label: "{{ item.description }}"

- name: Collect the rules that need updating
  ansible.builtin.set_fact:
    rules_to_update: >-
      {{ desired_rules
         | selectattr('description', 'in', _fw_rule_diffs | map(attribute='description') | list)
         | list }}

# Every managed row that is not the one kept copy of a declared rule: rules
# inventory no longer declares, AND duplicate copies of rules it does. Keyed on
# uuid, because description does not identify a row.
#
# Protected descriptions are excluded even when the row is a duplicate. Deleting
# a second copy of an anti-lockout rule is not worth the risk of getting the
# reasoning wrong about which copy is live.
- name: Collect the managed rules that should not be there
  ansible.builtin.set_fact:
    rules_to_delete: >-
      {{ _fw_managed_rows
         | rejectattr('uuid', 'in', _fw_keep_uuids)
         | rejectattr('description', 'in', firewall_protected_descriptions)
         | list }}
  vars:
    _fw_keep_uuids: >-
      {{ existing_rules_by_desc | dict2items
         | selectattr('key', 'in', desired_rules | map(attribute='description') | list)
         | map(attribute='value.uuid') | list }}

# Step 5: Report. Always, and before anything is written.
- name: Report the plan
  ansible.builtin.debug:
    msg: "{{ _report.split('\n') }}"
  vars:
    _desired_descs: "{{ desired_rules | map(attribute='description') | list }}"
    _report: |-
      {{ 'APPLY - the changes below will be written.'
         if firewall_apply | bool
         else 'PLAN ONLY - nothing will be written. Re-run with -e firewall_apply=true to apply.' }}

      ADD ({{ rules_to_add | length }}):
      {% for r in rules_to_add %}
        + {{ r.description }}
            on {{ r.interface }} {{ r.direction }} {{ r.action }} proto {{ r.protocol }} {{ '!' if r.source_not | default('0') == '1' else '' }}{{ r.source_net }} -> {{ '!' if r.destination_not | default('0') == '1' else '' }}{{ r.destination_net }}{{ ':' ~ r.destination_port if r.destination_port | length > 0 else '' }}
      {% else %}
        (none)
      {% endfor %}

      UPDATE ({{ _fw_rule_diffs | length }} of {{ _fw_rules_present | length }} already present):
      {% for d in _fw_rule_diffs %}
        ~ {{ d.description }}  [{{ d.uuid }}]
      {% for f in d.fields %}
            {{ f.field }}: {{ f.from | default('(empty)', true) }} -> {{ f.to | default('(empty)', true) }}
      {% endfor %}
      {% else %}
        (none - the router's copy matches inventory)
      {% endfor %}

      DELETE ({{ rules_to_delete | length }}){{ '' if firewall_delete_unmanaged | bool else ' - LEFT IN PLACE, firewall_delete_unmanaged is false' }}:
      {% for r in rules_to_delete %}
        - {{ r.description }}  [{{ r.uuid }}] on {{ r.interface }}  ({{ 'duplicate copy' if r.description in _desired_descs else 'not declared in inventory' }})
      {% else %}
        (none)
      {% endfor %}

      PROTECTED from deletion ({{ firewall_protected_descriptions | length }}):
      {% for d in firewall_protected_descriptions %}
        ! {{ d }}
      {% endfor %}

      Managed rules on the router: {{ _fw_managed_rows | length }} rows, {{ existing_rules_by_desc | length }} distinct descriptions.
      Declared by inventory: {{ desired_rules | length }}.

# Step 6a: Add new rules
#
# OPNsense reports a rejected rule as HTTP 200 with {"result":"failed"} and a
# `validations` object naming the offending fields - confirmed on this build,
# where even a GET to addRule answers 200 {"result":"failed"}. Checking the
# status code alone therefore reports every rejection as a success.
- name: Add new firewall rules
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/firewall/filter/addRule"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body:
      rule:
        enabled: "1"
        action: "{{ item.action }}"
        interface: "{{ item.interface }}"
        direction: "{{ item.direction }}"
        ipprotocol: "inet"
        protocol: "{{ item.protocol | default('any', true) }}"
        source_net: "{{ item.source_net | default('any', true) }}"
        source_not: "{{ item.source_not | default('0') }}"
        destination_net: "{{ item.destination_net | default('any', true) }}"
        destination_not: "{{ item.destination_not | default('0') }}"
        destination_port: "{{ item.destination_port | default('') }}"
        description: "{{ item.description }}"
        sequence: "{{ item.sequence }}"
    status_code: [200, 201]
    return_content: true
  loop: "{{ rules_to_add }}"
  loop_control:
    label: "Adding: {{ item.description }}"
  when:
    - firewall_apply | bool
    - rules_to_add | length > 0
  register: _fw_add
  delegate_to: localhost
  changed_when: true
  notify: apply firewall rules

# The loop is allowed to finish before failing, so the report names every
# rejected rule rather than only the first. Nothing is applied either way: the
# handler runs at the end of the play, and a failed play does not reach it.
- name: Fail if the router rejected any added rule
  ansible.builtin.fail:
    msg: |-
      The router accepted {{ _saved | length }} of {{ _sent | length }} rule additions.
      Rejected:
      {% for r in _sent %}
      {% if (r.json | default({})).result | default('missing') != 'saved' %}
        - {{ r.item.description }}
            result: {{ (r.json | default({})).result | default('no JSON body') }}
            {{ (r.json | default({})).validations | default('no validations returned') }}
      {% endif %}
      {% endfor %}
  vars:
    _sent: "{{ _fw_add.results | default([]) | rejectattr('skipped', 'defined') | list }}"
    _saved: "{{ _sent | selectattr('json.result', 'defined') | selectattr('json.result', 'equalto', 'saved') | list }}"
  when: _sent | length != _saved | length

# Step 6b: Update existing rules if changed
- name: Update existing firewall rules
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/firewall/filter/setRule/{{ existing_rules_by_desc[item.description].uuid }}"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body:
      rule:
        enabled: "1"
        action: "{{ item.action }}"
        interface: "{{ item.interface }}"
        direction: "{{ item.direction }}"
        ipprotocol: "inet"
        protocol: "{{ item.protocol | default('any', true) }}"
        source_net: "{{ item.source_net | default('any', true) }}"
        source_not: "{{ item.source_not | default('0') }}"
        destination_net: "{{ item.destination_net | default('any', true) }}"
        destination_not: "{{ item.destination_not | default('0') }}"
        destination_port: "{{ item.destination_port | default('') }}"
        description: "{{ item.description }}"
        sequence: "{{ item.sequence }}"
    status_code: [200, 201]
    return_content: true
  loop: "{{ rules_to_update }}"
  loop_control:
    label: "Updating: {{ item.description }}"
  when:
    - firewall_apply | bool
    - rules_to_update | length > 0
  register: _fw_update
  delegate_to: localhost
  changed_when: true
  notify: apply firewall rules

- name: Fail if the router rejected any updated rule
  ansible.builtin.fail:
    msg: |-
      The router accepted {{ _saved | length }} of {{ _sent | length }} rule updates.
      Rejected:
      {% for r in _sent %}
      {% if (r.json | default({})).result | default('missing') != 'saved' %}
        - {{ r.item.description }}
            result: {{ (r.json | default({})).result | default('no JSON body') }}
            {{ (r.json | default({})).validations | default('no validations returned') }}
      {% endif %}
      {% endfor %}
  vars:
    _sent: "{{ _fw_update.results | default([]) | rejectattr('skipped', 'defined') | list }}"
    _saved: "{{ _sent | selectattr('json.result', 'defined') | selectattr('json.result', 'equalto', 'saved') | list }}"
  when: _sent | length != _saved | length

# Step 6c: Delete managed rules that should not be there
#
# Gated twice: firewall_apply, and firewall_delete_unmanaged. This role
# reconciles by subtraction, so this task is the one capable of removing the
# policy that carries its own control path - and it is the reason a broken
# discovery became a site outage rather than a failed play.
- name: Delete the managed rules that should not be there
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/firewall/filter/delRule/{{ item.uuid }}"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    status_code: [200, 201]
    return_content: true
  loop: "{{ rules_to_delete }}"
  loop_control:
    label: "Deleting: {{ item.description }} [{{ item.uuid }}]"
  when:
    - firewall_apply | bool
    - firewall_delete_unmanaged | bool
    - rules_to_delete | length > 0
  register: _fw_delete
  delegate_to: localhost
  changed_when: true
  notify: apply firewall rules

- name: Fail if the router rejected any deletion
  ansible.builtin.fail:
    msg: |-
      The router accepted {{ _done | length }} of {{ _sent | length }} rule deletions.
      Rejected:
      {% for r in _sent %}
      {% if (r.json | default({})).result | default('missing') not in ['deleted', 'saved'] %}
        - {{ r.item.description }} [{{ r.item.uuid }}]
            result: {{ (r.json | default({})).result | default('no JSON body') }}
      {% endif %}
      {% endfor %}
  vars:
    _sent: "{{ _fw_delete.results | default([]) | rejectattr('skipped', 'defined') | list }}"
    _done: "{{ _sent | selectattr('json.result', 'defined')
               | selectattr('json.result', 'in', ['deleted', 'saved']) | list }}"
  when: _sent | length != _done | length

# Step 7: Report what actually happened
- name: Report the outcome
  ansible.builtin.debug:
    msg: >-
      {{ 'Nothing was written: this was a plan run (firewall_apply is false).'
         if not firewall_apply | bool
         else 'Added ' ~ (rules_to_add | length) ~ ', updated ' ~ (rules_to_update | length) ~ ', deleted ' ~
              ((rules_to_delete | length) if firewall_delete_unmanaged | bool else 0) ~
              ((', left ' ~ (rules_to_delete | length) ~ ' undeclared rule(s) in place')
               if not firewall_delete_unmanaged | bool and rules_to_delete | length > 0 else '') ~ '.' }}
