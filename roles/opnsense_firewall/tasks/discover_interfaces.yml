---
# Discover OPNsense interface assignments for VLAN segments
#
# Builds a mapping of zone name -> OPNsense interface identifier by matching
# VLAN device names (e.g., re0_vlan10) from the interfaces API.
#
# Output fact: zone_to_interface
#   {
#     "trusted": { "identifier": "opt1", "device": "re0_vlan10", "subnet": "10.20.10.0/24" },
#     ...
#   }

# Step 1: Fetch VLAN list to get device names
- name: Get VLAN configuration
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/interfaces/vlan_settings/searchItem"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body: {}
    return_content: true
  register: fw_vlans
  delegate_to: localhost

# Step 2: Build VLAN tag -> device name mapping
- name: Build VLAN tag to device mapping
  ansible.builtin.set_fact:
    fw_vlan_devices_by_tag: >-
      {{
        fw_vlan_devices_by_tag | default({}) | combine({
          (item.tag | string): item.vlanif | default('')
            | regex_replace('\s*\[.*$', '')
        })
      }}
  loop: "{{ fw_vlans.json.rows | default([]) }}"
  loop_control:
    label: "VLAN {{ item.tag | default('?') }} -> {{ item.vlanif | default('?') }}"
  when:
    - item.tag is defined
    - item.vlanif is defined

- name: Ensure fw_vlan_devices_by_tag is defined
  ansible.builtin.set_fact:
    fw_vlan_devices_by_tag: {}
  when: fw_vlan_devices_by_tag is not defined

# Step 3: Fetch interface assignments
- name: Get interface assignments
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/interfaces/overview/export"
    method: GET
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    return_content: true
  register: fw_interfaces
  delegate_to: localhost

# This endpoint answers with JSON but labels it "text/html; charset=UTF-8", so
# the uri module never populates .json and fw_interfaces.json is undefined.
# Parsing the body explicitly is what makes the response usable.
#
# The failure this caused was silent, which is the dangerous part: with no
# device map every zone resolved to "unmapped", every rule was filtered out by
# its `when`, and the role reported ok/changed=0 with "Total desired rules: 0" -
# reading exactly like a converged run while applying nothing at all. Nothing
# was deleted either, so the damage was limited to the policy never existing.
- name: Parse the interface assignments
  ansible.builtin.set_fact:
    fw_interface_list: "{{ fw_interfaces.content | from_json }}"

# Step 4: Build device -> interface identifier mapping
#
# The endpoint returns a LIST of interface objects, each carrying its own
# `identifier` and `device`. It was previously read as a dict keyed by
# identifier, which dict2items cannot do to a list.
#
# Entries with an empty identifier are unassigned interfaces and are skipped by
# design - tenant_underlay is deliberately one of them, since the core router
# neither routes it nor holds an address on it (ADR-0001).
- name: Build device to interface mapping
  ansible.builtin.set_fact:
    fw_device_to_interface: >-
      {{
        fw_device_to_interface | default({}) | combine({
          (item.device): {
            'identifier': item.identifier,
            'device': item.device
          }
        })
      }}
  loop: "{{ fw_interface_list }}"
  loop_control:
    label: "{{ item.identifier | default('?') }} -> {{ item.device | default('?') }}"
  when:
    - item.device is defined
    - item.device | length > 0
    - item.identifier is defined
    - item.identifier | length > 0

- name: Ensure fw_device_to_interface is defined
  ansible.builtin.set_fact:
    fw_device_to_interface: {}
  when: fw_device_to_interface is not defined

# Step 5: Build zone name -> interface identifier mapping
- name: Build zone to interface mapping
  ansible.builtin.set_fact:
    zone_to_interface: >-
      {{
        zone_to_interface | default({}) | combine({
          (item.key): {
            'identifier': fw_device_to_interface[_device].identifier | default(''),
            'device': _device,
            'subnet': item.value.subnet | default('')
          }
        })
      }}
  vars:
    _device: "{{ fw_vlan_devices_by_tag[item.value.vlan_id | string] | default('') }}"
  loop: "{{ deevnet_vlans | dict2items }}"
  loop_control:
    label: "{{ item.key }} -> {{ fw_device_to_interface[_device].identifier | default('unmapped') }}"
  when:
    - item.value.vlan_id is defined
    - item.value.subnet is defined
    - _device | length > 0
    - _device in fw_device_to_interface

- name: Ensure zone_to_interface is defined
  ansible.builtin.set_fact:
    zone_to_interface: {}
  when: zone_to_interface is not defined

# Discovery is the input the whole reconcile trusts. When it resolves nothing -
# because the endpoint changed shape, the credential lost a privilege, or the
# router is mid-reconfigure - every rule is filtered out by its own `when`, the
# desired set comes out empty, and configure_rules.yml reads that as "inventory
# declares no rules" rather than "I failed to look". On 2026-09-07 that removed
# the entire policy while reporting ok/changed=0.
#
# There is no legitimate run of this role against a substrate with VLANs where
# zero zones resolve, so refusing is always right. Partial discovery is refused
# for the same reason: it would delete exactly the rules for the zones it failed
# to resolve.
- name: Assert interface discovery resolved
  ansible.builtin.assert:
    that:
      - fw_interface_list | default([]) | length > 0
      - zone_to_interface | length > 0
      - _fw_unresolved_from_zones | length == 0
    fail_msg: >-
      Interface discovery resolved {{ zone_to_interface | length }} of
      {{ deevnet_vlans | length }} zones and will not be used to reconcile.
      {% if fw_interface_list | default([]) | length == 0 %}The interface export
      returned nothing - check the API credential and that
      {{ opnsense_api_url }}/interfaces/overview/export still answers.
      {% elif _fw_unresolved_from_zones | length > 0 %}These zones are named in
      firewall_zone_policies but did not resolve to an interface:
      {{ _fw_unresolved_from_zones | join(', ') }}. Their VLANs may be missing
      from the router, or unassigned.
      {% endif %}
      Refusing rather than building a partial policy: an unresolved zone
      contributes no rules, and every rule it should have contributed becomes a
      deletion candidate.
    success_msg: >-
      Discovery resolved {{ zone_to_interface | length }} zones; all
      {{ firewall_zone_policies | map(attribute='from_zone') | unique | length }}
      policy source zones are mapped.
  vars:
    _fw_unresolved_from_zones: >-
      {{ firewall_zone_policies
         | map(attribute='from_zone') | unique
         | reject('in', zone_to_interface)
         | list }}

- name: Display zone to interface mapping
  ansible.builtin.debug:
    msg: "{{ item.key }}: {{ item.value.identifier }} ({{ item.value.device }})"
  loop: "{{ zone_to_interface | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
