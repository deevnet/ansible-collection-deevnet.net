---
# Calls run on the CONTROL NODE, as the rest of this collection's OPNsense work
# does. A rejected write can come back HTTP 200 with result "failed", and an
# import error as HTTP 500 (the API's own UserException), so every write checks
# its result as well as its status.

- name: Read the router's CAs
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/trust/ca/search"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body: {}
  register: _oc_cas
  delegate_to: localhost

# The root first, so the intermediate links to it on import.
- name: Import the site root and the bootstrap intermediate
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/trust/ca/add"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body:
      ca:
        action: existing
        descr: "{{ item.descr }}"
        crt_payload: "{{ lookup('file', item.file) }}"
  loop:
    - { descr: "{{ opnsense_cert_root_descr }}", file: "{{ site_root_ca_file }}" }
    - { descr: "{{ opnsense_cert_intermediate_descr }}", file: "{{ site_bootstrap_ca_file }}" }
  loop_control:
    label: "{{ item.descr }}"
  when: item.descr not in (_oc_cas.json.rows | map(attribute='descr') | list)
  register: _oc_ca_add
  failed_when: _oc_ca_add.status != 200 or (_oc_ca_add.json | default({})).result | default('') != 'saved'
  changed_when: true
  delegate_to: localhost

- name: Read the router's certificates
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/trust/cert/search"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_validate_certs }}"
    body_format: json
    body: {}
  register: _oc_certs
  delegate_to: localhost

- name: Find the site certificate
  ansible.builtin.set_fact:
    _oc_site_cert: "{{ _oc_certs.json.rows | selectattr('descr', 'equalto', opnsense_cert_descr) | first | default({}) }}"

# Due: fewer than renew_before seconds left. valid_to is a Unix time.
- name: Decide whether to issue
  ansible.builtin.set_fact:
    _oc_wanted: >-
      {{ _oc_site_cert | length == 0
         or (_oc_site_cert.valid_to | int) - (now(utc=true).timestamp() | int) < (opnsense_cert_renew_before | int) }}

- name: Issue and import the router's certificate
  when: _oc_wanted | bool
  block:
    - name: Issue the certificate
      ansible.builtin.include_role:
        name: deevnet.builder.site_bootstrap_cert
      vars:
        site_bootstrap_cert_dns_names: "{{ opnsense_cert_dns_names }}"
        site_bootstrap_cert_ips: "{{ opnsense_cert_ips }}"

    # The leaf alone: the GUI appends the chain from the CA it links on import.
    - name: Import it
      ansible.builtin.uri:
        url: "{{ opnsense_api_url }}/trust/cert/add"
        method: POST
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: "{{ opnsense_validate_certs }}"
        body_format: json
        body:
          cert:
            action: import
            descr: "{{ opnsense_cert_descr }}"
            crt_payload: "{{ site_bootstrap_cert_result.certificate }}"
            prv_payload: "{{ site_bootstrap_cert_result.private_key }}"
      register: _oc_cert_add
      failed_when: _oc_cert_add.status != 200 or (_oc_cert_add.json | default({})).result | default('') != 'saved'
      changed_when: true
      delegate_to: localhost
      no_log: true
      when: _oc_site_cert | length == 0

    # Renewal replaces the payload of the certificate the GUI already uses, so
    # the GUI selection survives. Whether the Trust API accepts that is
    # confirmed the first time a renewal runs; the read-back below proves it.
    - name: Replace its payload in place
      ansible.builtin.uri:
        url: "{{ opnsense_api_url }}/trust/cert/set/{{ _oc_site_cert.uuid }}"
        method: POST
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: "{{ opnsense_validate_certs }}"
        body_format: json
        body:
          cert:
            action: import
            descr: "{{ opnsense_cert_descr }}"
            crt_payload: "{{ site_bootstrap_cert_result.certificate }}"
            prv_payload: "{{ site_bootstrap_cert_result.private_key }}"
      register: _oc_cert_set
      failed_when: _oc_cert_set.status != 200 or (_oc_cert_set.json | default({})).result | default('') != 'saved'
      changed_when: true
      delegate_to: localhost
      no_log: true
      when: _oc_site_cert | length > 0

    - name: Read the certificate back
      ansible.builtin.uri:
        url: "{{ opnsense_api_url }}/trust/cert/search"
        method: POST
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: "{{ opnsense_validate_certs }}"
        body_format: json
        body: {}
      register: _oc_certs_after
      delegate_to: localhost

    - name: Confirm the router holds the new certificate, linked to the intermediate
      vars:
        _row: "{{ _oc_certs_after.json.rows | selectattr('descr', 'equalto', opnsense_cert_descr) | first | default({}) }}"
      ansible.builtin.assert:
        that:
          - _row | length > 0
          - (_row.valid_to | int) - (now(utc=true).timestamp() | int) > (opnsense_cert_renew_before | int)
          - _row.caref | default('') | length > 0
        fail_msg: >-
          The router does not show {{ opnsense_cert_descr }} as a fresh certificate linked to a CA
          after the import. Read it in System > Trust > Certificates.
        quiet: true

# What clients get. Until the operator has chosen the certificate in the GUI
# once, this reports the manual step instead of failing the run.
- name: Check the GUI serves the site certificate
  ansible.builtin.shell:
    cmd: >-
      echo | timeout 10 openssl s_client -connect {{ opnsense_cert_check_host }}:443
      -servername {{ opnsense_cert_check_name }} -verify_hostname {{ opnsense_cert_check_name }}
      -CAfile {{ site_root_ca_file | quote }} -verify_return_error 2>&1
      | grep -q 'Verify return code: 0 (ok)'
  register: _oc_served
  failed_when: false
  changed_when: false
  check_mode: false
  delegate_to: localhost

- name: Say what is left to do
  ansible.builtin.debug:
    msg: >-
      {{ 'The web GUI serves the site certificate.' if _oc_served.rc == 0 else
         'MANUAL STEP: in the router GUI, System > Settings > Administration > SSL Certificate, choose "'
         ~ opnsense_cert_descr ~ '" and Save (the GUI restarts). Then run this again.' }}
