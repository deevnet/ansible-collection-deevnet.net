namespace: deevnet
name: net
version: 1.0.0
readme: README.md
authors:
  - Chris Deever
license:
  - Apache-2.0
description: Network automation for Deevnet substrates (OPNsense, DNS, DHCP)
tags:
  - dns
  - dhcp
  - network
  - provisioning
  - opnsense
dependencies:
  ansible.posix: ">=1.5.0"
  ansible.netcommon: ">=7.0.0"

# Kept out of the tarball. .ansible holds the collection installed from the
# previous tarball (make install-dev), so without this each build packed every
# earlier one inside it.
build_ignore:
  - .ansible
  - "*.tar.gz"
  - .deps.stamp
