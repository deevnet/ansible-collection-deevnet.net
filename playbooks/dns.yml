---
# Configure OPNsense DNS for substrate
#
# Secrets are vaulted in inventory (group_vars/routers/vault.yml).
# Usage:
#   ansible-playbook playbooks/dns.yml --ask-vault-pass

- name: Configure OPNsense DNS
  hosts: dns_servers
  gather_facts: false
  roles:
    - opnsense_dns
    # Last: the configuration as this run left it, staged for the make target
    # to seal into the inventory (make seal-backups after a raw run).
    - role: opnsense_backup
      tags: [always]
