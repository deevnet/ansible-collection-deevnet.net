---
# Back up the core router's configuration (config.xml).
#
# Downloads the running configuration to a private staging directory on the
# control host. It is still plaintext there: `make backup-router` runs this and
# then scripts/vault-router-backup.py, which encrypts it with the inventory's
# vault password into ansible-inventory-deevnet/backups/<site>/<host>/ and
# deletes the plaintext. Run it through make.
#
# The opnsense_firewall role stages the same file, through the same role, before
# every apply.

- name: Back up the OPNsense configuration
  hosts: dns_servers
  gather_facts: false
  roles:
    - opnsense_backup
