---
# Site wireless from inventory, through the Omada Open API (ADR-0009, CHG-0005)
#
# Inventory is the only declaration (ADR-0009); the controller applies it:
#
#   networks  one LAN network per deevnet_vlans segment that has a wifi_ssid,
#             matched on VLAN id - so the networks created by hand-era tooling
#             are recognised, whatever they are called
#   profiles  one PPSK profile per segment that declares wifi_security: ppsk,
#             matched on name. The profile is created EMPTY - the keys inside it
#             are tenant content written by the Deevnet API, not by inventory
#             (ADR-0012 section 6). This play never reads or prints them.
#   SSIDs     one per segment with a wifi_ssid, in the site's primary WLAN group,
#             matched on name, tagged to the segment's network. A shared-key
#             segment is keyed from deevnet_wifi_psk[<segment>]; a ppsk segment
#             is security 4, bound to its profile, and has no shared key.
#   the AP    once adopted: its name and static address, from
#             host_vars/<omada_ap_host>. An adopted AP joins the site's primary
#             WLAN group, which is where the SSIDs above are created.
#
# Modes:
#
#   plan (default)   No writes. Checks every endpoint against the spec the RUNNING
#                    controller publishes, builds the desired state from inventory,
#                    and - when the Open API client is in the vault - reads the
#                    controller and reports what apply would add, what differs,
#                    and what the controller holds that inventory does not declare.
#   apply            -e omada_apply=true. Creates what is missing, then sets the
#                    AP if it is adopted, then re-reads and verifies.
#   adopt            -e omada_apply=true -e omada_adopt=true. Also adopts the AP
#                    if it is pending, with its standalone credentials, and waits
#                    for it to connect.
#
# Guards, after INC-0001:
#   - an empty desired set is refused; a shared-key segment with no key is
#     refused, and so is a ppsk segment that still has one;
#   - nothing is ever deleted - objects inventory does not declare are reported
#     and left in place, and existing objects that differ are reported, not
#     rewritten;
#   - the AP's address is only ever set to the one inventory declares, which is
#     the one OPNsense reserves for it, and the AP must answer there afterwards.
#
# Needs, in group_vars/network_controllers/vault.yml:
#   vault_omada_openapi_client_id / _secret   Open API client (client credentials),
#                                             created once by the Owner in the UI
#   vault_wap_standalone_user / _password     only for -e omada_adopt=true
#
# API markers (ADR-0009). On a controller upgrade:  grep -rn "omada-api: UNDOCUMENTED"
#
# Usage:
#   ansible-playbook playbooks/omada-wireless.yml
#   ansible-playbook playbooks/omada-wireless.yml -e omada_apply=true
#   ansible-playbook playbooks/omada-wireless.yml -e omada_apply=true -e omada_adopt=true

- name: Site wireless from inventory, through the Omada Open API
  hosts: network_controllers
  gather_facts: false
  vars:
    omada_url: "https://localhost:8043"
    omada_apply: false
    omada_adopt: false
    omada_marked_version: "6.3.0.45"
    omada_ap_host: dv02wap001p01
    omada_adopt_timeout: 300                  # seconds to wait for the AP to connect

    # Segments in deevnet_vlans to leave out of this run, by key. Normally empty:
    # inventory declares the wireless segments and this play reconciles all of them.
    #
    # It exists because an SSID is created once and never rewritten (see the guards
    # above), so a segment whose security model is still being decided must not be
    # created with the wrong one "for now". CHG-0005 held out `iot` while PPSK was
    # proven on the AP; CHG-0013 settled the model and dropped the skip.
    #
    #   -e '{"omada_segment_skip":["iot"]}'
    omada_segment_skip: []

    # Rewrite a shared key on the controller when it no longer matches
    # deevnet_wifi_psk. Off by default and deliberately separate from
    # omada_apply, because this is the one reconciliation that disconnects
    # people: every client on that SSID drops and must be re-keyed by hand.
    # Drift is always REPORTED; correcting it is a decision.
    #
    #   -e omada_apply=true -e omada_reconcile_psk=true
    omada_reconcile_psk: false

    # The SSID settings CHG-0001's hand-configured SSIDs and the March migration
    # playbook used, kept so the controller-provisioned SSIDs behave the same.
    omada_ssid_base:
      band: 3                  # 2.4 + 5 GHz
      deviceType: 1            # EAPs only
      broadcast: true
      security: 3              # WPA-Personal
      enable11r: false
      pmfMode: 3               # PMF disabled
      mloEnable: false
      hidePwd: true            # do not show the key in the controller UI
      vlanEnable: true

    omada_endpoints:
      - {method: get, path: "/openapi/v1/{omadacId}/sites"}
      - {method: get, path: "/openapi/v1/{omadacId}/sites/{siteId}/lan-networks"}
      - {method: post, path: "/openapi/v1/{omadacId}/sites/{siteId}/lan-networks"}
      - {method: get, path: "/openapi/v1/{omadacId}/sites/{siteId}/ppsk-profiles"}
      - {method: post, path: "/openapi/v1/{omadacId}/sites/{siteId}/ppsk-profile"}
      - {method: post, path: "/openapi/v1/{omadacId}/sites/{siteId}/ppsk-profile/{profileId}/delete-psk"}
      - {method: get, path: "/openapi/v1/{omadacId}/sites/{siteId}/wireless-network/wlans"}
      - {method: get, path: "/openapi/v1/{omadacId}/sites/{siteId}/wireless-network/wlans/{wlanId}/ssids"}
      - {method: post, path: "/openapi/v1/{omadacId}/sites/{siteId}/wireless-network/wlans/{wlanId}/ssids"}
      - {method: get, path: "/openapi/v1/{omadacId}/sites/{siteId}/wireless-network/wlans/{wlanId}/ssids/{ssidId}"}
      - {method: patch, path: "/openapi/v1/{omadacId}/sites/{siteId}/wireless-network/wlans/{wlanId}/ssids/{ssidId}/update-basic-config"}
      - {method: get, path: "/openapi/v1/{omadacId}/sites/{siteId}/devices"}
      - {method: post, path: "/openapi/v1/{omadacId}/sites/{siteId}/devices/{deviceMac}/start-adopt"}
      - {method: patch, path: "/openapi/v1/{omadacId}/sites/{siteId}/aps/{apMac}/general-config"}
      - {method: patch, path: "/openapi/v1/{omadacId}/sites/{siteId}/aps/{apMac}/ip-setting"}

  tasks:
    # --- Preflight --------------------------------------------------------------

    - name: Read the controller identity
      # omada-api: UNDOCUMENTED /api/info tested-on 6.3.0.45
      # Unauthenticated; the only source of omadacId before a token exists.
      ansible.builtin.uri:
        url: "{{ omada_url }}/api/info"
        validate_certs: false
      register: omada_info

    - name: Note when the controller is not the version the markers were checked on
      ansible.builtin.debug:
        msg: >-
          Controller is {{ omada_info.json.result.controllerVer }}; this play's markers were
          checked on {{ omada_marked_version }}. The endpoint check protects the documented
          calls; re-test the UNDOCUMENTED one by hand.
      when: omada_info.json.result.controllerVer != omada_marked_version

    - name: Fetch the Open API spec the running controller publishes
      # omada-api: documented springdoc /v3/api-docs spec 6.3.0.45
      ansible.builtin.uri:
        url: "{{ omada_url }}/v3/api-docs/00%20All"
        validate_certs: false
        timeout: 120
      register: omada_spec

    - name: Refuse to run if an endpoint this play uses is not documented here
      ansible.builtin.assert:
        that:
          - item.path in omada_spec.json.paths
          - item.method in omada_spec.json.paths[item.path]
        fail_msg: >-
          {{ item.method | upper }} {{ item.path }} is not in the spec published by controller
          {{ omada_info.json.result.controllerVer }}.
        quiet: true
      loop: "{{ omada_endpoints }}"
      loop_control:
        label: "{{ item.method | upper }} {{ item.path }}"

    # --- Desired state, from inventory only ---------------------------------------

    - name: Derive the wireless segments and the AP from inventory
      vars:
        _ap_if: "{{ hostvars[omada_ap_host].env.interfaces.eth0 }}"
      ansible.builtin.set_fact:
        omada_segments: >-
          {{ deevnet_vlans | dict2items | selectattr('value.wifi_ssid', 'defined')
             | rejectattr('key', 'in', omada_segment_skip) | list }}
        omada_ap:
          name: "{{ omada_ap_host }}"
          mac: "{{ hostvars[omada_ap_host].infrastructure.interfaces.eth0.mac | upper | replace(':', '-') }}"
          ip: "{{ _ap_if.ip }}"
          gateway: "{{ _ap_if.gateway | default(deevnet_vlans[_ap_if.segment].gateway) }}"
          netmask: "255.255.255.0"
          dns: "{{ _ap_if.gateway | default(deevnet_vlans[_ap_if.segment].gateway) }}"

    - name: Split the wireless segments by security model
      # A segment declares wifi_security: ppsk to be keyed per tenant by the
      # Deevnet API (ADR-0012 section 6). Anything else, including the far more
      # common case of saying nothing at all, is a shared key from the vault.
      ansible.builtin.set_fact:
        omada_segments_psk: >-
          {{ omada_segments | rejectattr('value.wifi_security', 'defined') | list
             + omada_segments | selectattr('value.wifi_security', 'defined')
               | selectattr('value.wifi_security', 'equalto', 'psk') | list }}
        omada_segments_ppsk: >-
          {{ omada_segments | selectattr('value.wifi_security', 'defined')
             | selectattr('value.wifi_security', 'equalto', 'ppsk') | list }}

    - name: Refuse an empty desired set, or a segment whose keying is wrong
      ansible.builtin.assert:
        that:
          - omada_segments | length > 0
          # Every segment must land in exactly one bucket. Without this, a typo
          # such as `wifi_security: ppks` drops the segment from both and the
          # play converges on silently doing nothing - the INC-0001 failure.
          - (omada_segments_psk | length) + (omada_segments_ppsk | length) == omada_segments | length
          - omada_segments_psk | map(attribute='key') | reject('in', deevnet_wifi_psk.keys() | list) | list | length == 0
          # A ppsk segment must NOT carry a shared key: the keys in its profile
          # belong to tenants, and a leftover vault key would be handed to the
          # controller as if it were one.
          - omada_segments_ppsk | map(attribute='key') | select('in', deevnet_wifi_psk.keys() | list) | list | length == 0
          - omada_segments_ppsk | rejectattr('value.wifi_ppsk_profile', 'defined') | list | length == 0
        fail_msg: >-
          Refusing to reconcile. Either no segment in deevnet_vlans declares a wifi_ssid; or a
          segment's wifi_security is neither 'psk' nor 'ppsk'; or
          {{ omada_segments_psk | map(attribute='key') | reject('in', deevnet_wifi_psk.keys() | list) | list }}
          has no key in deevnet_wifi_psk; or
          {{ omada_segments_ppsk | map(attribute='key') | select('in', deevnet_wifi_psk.keys() | list) | list }}
          is ppsk but still has one; or a ppsk segment names no wifi_ppsk_profile. An empty or
          partial desired set is a failure, not a converged state (INC-0001).
        quiet: true

    - name: Refuse a shared key the controller would reject (8-63 characters)
      ansible.builtin.assert:
        that:
          - deevnet_wifi_psk[item.key] | length >= 8
          - deevnet_wifi_psk[item.key] | length <= 63
        quiet: true
      loop: "{{ omada_segments_psk }}"
      no_log: true

    - name: Show the desired state
      ansible.builtin.debug:
        msg:
          controller: "{{ omada_info.json.result.controllerVer }}"
          mode: "{{ ('apply' ~ (' + adopt' if omada_adopt | bool else '')) if omada_apply | bool else 'plan (no writes)' }}"
          ssids: "{{ omada_segments | map(attribute='value.wifi_ssid') | zip(omada_segments | map(attribute='value.vlan_id')) | map('join', ' -> VLAN ') | list }}"
          ppsk_ssids: "{{ omada_segments_ppsk | map(attribute='value.wifi_ssid') | list }}"
          ap: "{{ omada_ap }}"

    # --- Current state (needs the Open API client) --------------------------------

    - name: Stop here in plan mode when there is no Open API client yet
      ansible.builtin.meta: end_play
      when:
        - vault_omada_openapi_client_id is not defined or vault_omada_openapi_client_secret is not defined
        - not omada_apply | bool

    - name: Refuse to apply without the Open API client
      ansible.builtin.assert:
        that:
          - vault_omada_openapi_client_id is defined
          - vault_omada_openapi_client_secret is defined
        fail_msg: >-
          No Open API client in the vault. The Owner creates one in the controller (Global View >
          Settings > Platform Integration > Open API); store it as vault_omada_openapi_client_id /
          vault_omada_openapi_client_secret in group_vars/network_controllers/vault.yml.
        quiet: true

    - name: Get an access token with the client credentials
      # omada-api: documented authorize/token (TP-Link Open API guide; not in the served spec) spec 6.3.0.45
      ansible.builtin.uri:
        url: "{{ omada_url }}/openapi/authorize/token?grant_type=client_credentials"
        method: POST
        body_format: json
        body:
          omadacId: "{{ omada_info.json.result.omadacId }}"
          client_id: "{{ vault_omada_openapi_client_id }}"
          client_secret: "{{ vault_omada_openapi_client_secret }}"
        validate_certs: false
      register: omada_token
      failed_when: omada_token.json.errorCode | default(-1) != 0
      no_log: true

    - name: Set the API base and header
      ansible.builtin.set_fact:
        omada_api: "{{ omada_url }}/openapi/v1/{{ omada_info.json.result.omadacId }}"
        omada_hdr:
          Authorization: "AccessToken={{ omada_token.json.result.accessToken }}"
      no_log: true

    - name: List sites
      # omada-api: documented getSiteList spec 6.3.0.45
      ansible.builtin.uri:
        url: "{{ omada_api }}/sites?page=1&pageSize=100"
        headers: "{{ omada_hdr }}"
        validate_certs: false
      register: omada_sites
      failed_when: omada_sites.json.errorCode != 0 or omada_sites.json.result.data | length != 1

    - name: Remember the site
      ansible.builtin.set_fact:
        omada_site: "{{ omada_api }}/sites/{{ omada_sites.json.result.data[0].siteId }}"

    - name: Read networks, WLAN groups and devices
      # omada-api: documented getLanNetworkList, getWlanGroupList, getSiteDeviceList spec 6.3.0.45
      ansible.builtin.uri:
        url: "{{ omada_site }}/{{ item }}"
        headers: "{{ omada_hdr }}"
        validate_certs: false
      loop:
        - "lan-networks?page=1&pageSize=100"
        - "wireless-network/wlans"
        - "devices?page=1&pageSize=100"
      register: omada_read
      failed_when: omada_read.json.errorCode | default(-1) != 0

    - name: Pick the primary WLAN group
      ansible.builtin.set_fact:
        omada_networks: "{{ omada_read.results[0].json.result.data }}"
        omada_wlan: "{{ omada_read.results[1].json.result | selectattr('primary', 'defined') | selectattr('primary') | first }}"
        omada_devices: "{{ omada_read.results[2].json.result.data }}"

    - name: Read the SSIDs in that group
      # omada-api: documented getSsidList spec 6.3.0.45
      ansible.builtin.uri:
        url: "{{ omada_site }}/wireless-network/wlans/{{ omada_wlan.wlanId | default(omada_wlan.id) }}/ssids?page=1&pageSize=100"
        headers: "{{ omada_hdr }}"
        validate_certs: false
      register: omada_ssids_read
      failed_when: omada_ssids_read.json.errorCode != 0

    - name: Read the PPSK profiles
      # omada-api: documented getPPSKProfiles spec 6.3.0.45
      # Read unconditionally, even at a site with no ppsk segment, so the report
      # can still name a profile the controller holds that inventory does not.
      # This is the BRIEF list - id, profileName and the SSIDs bound to it. The
      # keys inside a profile are deliberately never fetched: getPPSKProfileDetail
      # returns them with their passwords in plaintext, and those are live tenant
      # credentials that have no business in Ansible memory or output (ADR-0012).
      ansible.builtin.uri:
        url: "{{ omada_site }}/ppsk-profiles"
        headers: "{{ omada_hdr }}"
        validate_certs: false
      register: omada_ppsk_read
      failed_when: omada_ppsk_read.json.errorCode != 0

    - name: Compare the controller with inventory
      vars:
        _declared_vlans: "{{ omada_segments | map(attribute='value.vlan_id') | map('int') | list }}"
        _declared_names: "{{ omada_segments | map(attribute='value.wifi_ssid') | list }}"
        _have_vlans: "{{ omada_networks | selectattr('vlan', 'defined') | map(attribute='vlan') | map('int') | list }}"
        _have_ssids: "{{ omada_ssids_read.json.result.data }}"
      ansible.builtin.set_fact:
        omada_networks_missing: "{{ omada_segments | rejectattr('value.vlan_id', 'in', _have_vlans) | list }}"
        omada_ssids_missing: "{{ omada_segments | rejectattr('value.wifi_ssid', 'in', _have_ssids | map(attribute='name') | list) | list }}"
        omada_ssids_undeclared: "{{ _have_ssids | rejectattr('name', 'in', _declared_names) | map(attribute='name') | list }}"
        omada_ap_device: "{{ omada_devices | selectattr('mac', 'equalto', omada_ap.mac) | first | default({}) }}"
        # getPPSKProfiles returns its result as a bare array, not the
        # {result: {data: [...]}} grid the network and SSID reads use.
        omada_ppsk_profiles_missing: >-
          {{ omada_segments_ppsk | rejectattr('value.wifi_ppsk_profile', 'in',
               omada_ppsk_read.json.result | default([]) | map(attribute='profileName') | list) | list }}
        omada_ppsk_profiles_undeclared: >-
          {{ omada_ppsk_read.json.result | default([])
             | rejectattr('profileName', 'in', omada_segments_ppsk | map(attribute='value.wifi_ppsk_profile') | list)
             | map(attribute='profileName') | list }}

    - name: Find declared SSIDs whose VLAN or security model differs from inventory
      # The security comparison matters as much as the VLAN one: this play never
      # rewrites an existing SSID, so a DVNTM-IOT created as a shared key at some
      # point would otherwise stay wrong forever without anything saying so.
      # getSsidList returns `security`, so this costs no extra request.
      vars:
        _declared: "{{ omada_segments | map(attribute='value') | items2dict(key_name='wifi_ssid', value_name='vlan_id') }}"
        _declared_sec: >-
          {{ dict(omada_segments | map(attribute='value.wifi_ssid') | list
                  | zip(omada_segments | map(attribute='value.wifi_security') | map('default', 'psk') | list)) }}
        _sec_wanted: "{{ 4 if _declared_sec[item.name] == 'ppsk' else 3 }}"
      ansible.builtin.set_fact:
        omada_ssids_differ: >-
          {{ omada_ssids_differ | default([])
             + [item.name ~ ' is VLAN ' ~ (item.vlanId | default('none')) ~ '/security ' ~ (item.security | default('none'))
                ~ ', inventory says VLAN ' ~ _declared[item.name] ~ '/security ' ~ _sec_wanted] }}
      loop: "{{ omada_ssids_read.json.result.data | selectattr('name', 'in', _declared.keys() | list) | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        (item.vlanId | default(0) | int) != (_declared[item.name] | int)
        or (item.security | default(0) | int) != (_sec_wanted | int)

    # The list endpoint does not return the key; the per-SSID detail endpoint
    # does. One extra request per declared shared-key SSID, and it is the only
    # way to know whether inventory and the controller still agree. Without it
    # deevnet_wifi_psk is an assertion nothing checks - which is how it sat
    # until CHG-0007 phase 3 happened to compare one by hand.
    - name: Read each declared shared-key SSID in full, for its key
      # omada-api: documented getSsid spec 6.3.0.45
      ansible.builtin.uri:
        url: "{{ omada_site }}/wireless-network/wlans/{{ omada_wlan.wlanId | default(omada_wlan.id) }}/ssids/{{ item.ssidId | default(item.id) }}"
        headers: "{{ omada_hdr }}"
        validate_certs: false
      register: omada_ssid_details
      failed_when: omada_ssid_details.json.errorCode != 0
      loop: >-
        {{ omada_ssids_read.json.result.data
           | selectattr('name', 'in', omada_segments_psk | map(attribute='value.wifi_ssid') | list) | list }}
      loop_control:
        label: "{{ item.name }}"

    - name: Find shared keys that no longer match inventory
      vars:
        _ssid_to_segment: >-
          {{ dict(omada_segments_psk | map(attribute='value.wifi_ssid') | list
                  | zip(omada_segments_psk | map(attribute='key') | list)) }}
        _live: "{{ (item.json.result.pskSetting | default({})).securityKey | default('') }}"
        _want: "{{ deevnet_wifi_psk[_ssid_to_segment[item.json.result.name]] | default('') }}"
      ansible.builtin.set_fact:
        omada_ssids_key_drift: >-
          {{ omada_ssids_key_drift | default([]) + [item.json.result.name] }}
      loop: "{{ omada_ssid_details.results | default([]) | rejectattr('skipped', 'defined') | list }}"
      loop_control:
        label: "{{ item.json.result.name | default('?') }}"
      when:
        - _want | length > 0
        - _live != _want
      no_log: true          # the comparison touches both keys

    - name: Report
      ansible.builtin.debug:
        msg:
          wlan_group: "{{ omada_wlan.name }}"
          networks_to_create: "{{ omada_networks_missing | map(attribute='value.vlan_id') | list }}"
          ppsk_profiles_to_create: "{{ omada_ppsk_profiles_missing | map(attribute='value.wifi_ppsk_profile') | list }}"
          ppsk_profiles_not_in_inventory_left_in_place: "{{ omada_ppsk_profiles_undeclared }}"
          ppsk_keys_are_api_owned_and_not_inspected: "{{ omada_segments_ppsk | map(attribute='value.wifi_ppsk_profile') | list }}"
          ssids_to_create: "{{ omada_ssids_missing | map(attribute='value.wifi_ssid') | list }}"
          ssids_that_differ_left_alone: "{{ omada_ssids_differ | default([]) }}"
          ssids_whose_key_differs_from_inventory: >-
            {{ (omada_ssids_key_drift | default([]))
               if (omada_ssids_key_drift | default([]) | length) > 0
               else 'none - every shared key matches deevnet_wifi_psk' }}
          keys_would_be_rewritten: >-
            {{ (omada_ssids_key_drift | default([]))
               if (omada_apply | bool and omada_reconcile_psk | bool)
               else 'no - omada_reconcile_psk is false, drift is reported only' }}
          ssids_not_in_inventory_left_in_place: "{{ omada_ssids_undeclared }}"
          ap: >-
            {{ omada_ap.mac }}:
            {{ {0: 'disconnected', 1: 'connected', 2: 'pending', 3: 'heartbeat missed', 4: 'isolated'}[omada_ap_device.status]
               if omada_ap_device else 'not seen by the controller' }}

    # --- Apply --------------------------------------------------------------------

    - name: Apply
      when: omada_apply | bool
      block:
        # A ppsk segment gets a LAN network like any other. The SSID still
        # carries vlanId/vlanSetting, which is what a client joining with a key
        # that has no VLAN binding would land on, and VLAN 30 is the right
        # default for DVNTM-IOT. A PER-KEY VLAN needs no network object at all -
        # it is raw 802.1Q tagging and OPNsense serves the DHCP (CHG-0005). That
        # only starts to matter when one profile carries keys for more than one
        # VLAN, which DVNTM-IOT does not.
        - name: Create the missing networks
          # omada-api: documented createLanNetwork spec 6.3.0.45
          ansible.builtin.uri:
            url: "{{ omada_site }}/lan-networks"
            method: POST
            headers: "{{ omada_hdr }}"
            body_format: json
            body: "{{ {'name': item.key, 'purpose': 0, 'vlan': item.value.vlan_id | int, 'igmpSnoopEnable': false} }}"
            validate_certs: false
          loop: "{{ omada_networks_missing }}"
          loop_control:
            label: "VLAN {{ item.value.vlan_id }} ({{ item.key }})"
          register: omada_net_created
          failed_when: omada_net_created.json.errorCode | default(-1) != 0

        - name: Re-read the networks, to resolve each segment's network id
          # omada-api: documented getLanNetworkList spec 6.3.0.45
          ansible.builtin.uri:
            url: "{{ omada_site }}/lan-networks?page=1&pageSize=100"
            headers: "{{ omada_hdr }}"
            validate_certs: false
          register: omada_networks_now
          failed_when: omada_networks_now.json.errorCode != 0

        # --- PPSK profiles, before the SSIDs that bind them -------------------
        #
        # A security-4 SSID carries ppskSetting.ppskProfileId, so the profile has
        # to exist first. It is created EMPTY: every key inside it is written by
        # the Deevnet API, one per tenant (ADR-0012 section 6).
        #
        # Whether this controller accepts an empty key list is undocumented.
        # PpskProfile marks `ppsk` required but sets no minItems, so [] is legal
        # by the published schema - and the running controller is ground truth,
        # not the schema (see the ip-setting note below). So: try empty, and if
        # it is refused, create with one random seed key and delete that key
        # immediately, which lands in the same place. The seed is never reported,
        # never reused, and does not outlive the play.
        - name: Create the missing PPSK profiles, with no keys
          # omada-api: documented createPPSKProfile spec 6.3.0.45
          ansible.builtin.uri:
            url: "{{ omada_site }}/ppsk-profile"
            method: POST
            headers: "{{ omada_hdr }}"
            body_format: json
            body:
              profileName: "{{ item.value.wifi_ppsk_profile }}"
              ppsk: []
            validate_certs: false
          loop: "{{ omada_ppsk_profiles_missing }}"
          loop_control:
            label: "{{ item.value.wifi_ppsk_profile }}"
          register: omada_ppsk_empty
          # Deliberately never fatal: a refusal here is an answer, not a failure.
          # The verify at the end of the play is what decides whether this worked.
          failed_when: false

        - name: Note which empty profiles the controller refused
          ansible.builtin.set_fact:
            omada_ppsk_seed_needed: >-
              {{ omada_ppsk_empty.results | default([])
                 | rejectattr('json.errorCode', 'defined') | map(attribute='item') | list
                 + omada_ppsk_empty.results | default([])
                   | selectattr('json.errorCode', 'defined')
                   | rejectattr('json.errorCode', 'equalto', 0) | map(attribute='item') | list }}

        - name: Say so, once, when this controller will not take an empty profile
          ansible.builtin.debug:
            msg: >-
              This controller refused a PPSK profile with an empty key list
              ({{ omada_ppsk_seed_needed | map(attribute='value.wifi_ppsk_profile') | list }});
              creating each with a single seed key and removing it. Worth recording in CHG-0013.
          when: omada_ppsk_seed_needed | length > 0

        - name: Create the refused profiles with one seed key
          # omada-api: documented createPPSKProfile spec 6.3.0.45
          vars:
            _seed: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
          ansible.builtin.uri:
            url: "{{ omada_site }}/ppsk-profile"
            method: POST
            headers: "{{ omada_hdr }}"
            body_format: json
            body:
              profileName: "{{ item.value.wifi_ppsk_profile }}"
              ppsk:
                - {name: "bootstrap", psk: "{{ _seed }}"}
            validate_certs: false
          loop: "{{ omada_ppsk_seed_needed }}"
          loop_control:
            label: "{{ item.value.wifi_ppsk_profile }}"
          register: omada_ppsk_seeded
          failed_when: omada_ppsk_seeded.json.errorCode | default(-1) != 0
          no_log: true

        - name: Remove the seed key, leaving the profile empty
          # omada-api: documented deletePSKsToPPSKProfile spec 6.3.0.45
          ansible.builtin.uri:
            url: "{{ omada_site }}/ppsk-profile/{{ item.json.result.id }}/delete-psk"
            method: POST
            headers: "{{ omada_hdr }}"
            body_format: json
            body:
              ppskNameList: ["bootstrap"]
            validate_certs: false
          loop: "{{ omada_ppsk_seeded.results | default([]) }}"
          loop_control:
            label: "{{ item.item.value.wifi_ppsk_profile | default('') }}"
          when: not (item.skipped | default(false))
          register: omada_ppsk_seed_removed
          failed_when:
            - not (omada_ppsk_seed_removed.skipped | default(false))
            - omada_ppsk_seed_removed.json.errorCode | default(-1) != 0

        - name: Re-read the PPSK profiles, to resolve each segment's profile id
          # omada-api: documented getPPSKProfiles spec 6.3.0.45
          ansible.builtin.uri:
            url: "{{ omada_site }}/ppsk-profiles"
            headers: "{{ omada_hdr }}"
            validate_certs: false
          register: omada_ppsk_now
          failed_when: omada_ppsk_now.json.errorCode != 0

        - name: Every ppsk segment must now have its profile
          ansible.builtin.assert:
            that:
              - omada_segments_ppsk | map(attribute='value.wifi_ppsk_profile')
                | reject('in', omada_ppsk_now.json.result | default([]) | map(attribute='profileName') | list)
                | list | length == 0
            fail_msg: >-
              A PPSK profile is still missing after both the empty and the seeded attempt, so the
              SSID that binds it cannot be created. Nothing further is written.
            quiet: true

        # Every client on the SSID drops when this lands. Gated separately from
        # omada_apply for that reason, and it sends the SSID's current settings
        # back unchanged apart from the key: update-basic-config requires band,
        # broadcast, enable11r, guestNetEnable, mloEnable, name, pmfMode,
        # security and vlanEnable, and anything omitted is reset rather than
        # left alone.
        - name: Rewrite a shared key that no longer matches inventory
          # omada-api: documented updateSsidBasicConfig spec 6.3.0.45
          vars:
            _cur: "{{ item.json.result }}"
            _seg: >-
              {{ (omada_segments_psk
                  | selectattr('value.wifi_ssid', 'equalto', _cur.name) | first).key }}
          ansible.builtin.uri:
            url: >-
              {{ omada_site }}/wireless-network/wlans/{{ omada_wlan.wlanId | default(omada_wlan.id) }}/ssids/{{ _cur.ssidId | default(_cur.id) }}/update-basic-config
            method: PATCH
            headers: "{{ omada_hdr }}"
            body_format: json
            body: >-
              {{ {
                   'name': _cur.name,
                   'band': _cur.band,
                   'broadcast': _cur.broadcast,
                   'enable11r': _cur.enable11r,
                   'guestNetEnable': _cur.guestNetEnable,
                   'mloEnable': _cur.mloEnable,
                   'pmfMode': _cur.pmfMode,
                   'security': _cur.security,
                   'vlanEnable': _cur.vlanEnable,
                   'vlanId': _cur.vlanId,
                   'vlanSetting': _cur.vlanSetting,
                   'pskSetting': (_cur.pskSetting | combine({'securityKey': deevnet_wifi_psk[_seg]}))
                 } }}
            validate_certs: false
          loop: >-
            {{ omada_ssid_details.results | default([]) | rejectattr('skipped', 'defined')
               | selectattr('json.result.name', 'in', omada_ssids_key_drift | default([])) | list }}
          loop_control:
            label: "{{ item.json.result.name }}"
          register: omada_key_rewritten
          failed_when: omada_key_rewritten.json.errorCode | default(-1) != 0
          changed_when: true
          when: omada_reconcile_psk | bool
          no_log: true          # the body carries the key

        - name: Say which SSIDs were re-keyed
          ansible.builtin.debug:
            msg: >-
              Re-keyed {{ omada_ssids_key_drift | default([]) | join(', ') }}.
              Every client on {{ 'those SSIDs' if (omada_ssids_key_drift | default([]) | length) > 1 else 'that SSID' }}
              has been disconnected and needs the new key.
          when:
            - omada_reconcile_psk | bool
            - (omada_ssids_key_drift | default([]) | length) > 0

        - name: Create the missing SSIDs, each tagged to its segment's network
          # omada-api: documented createSsid spec 6.3.0.45
          vars:
            _net: >-
              {{ omada_networks_now.json.result.data | selectattr('vlan', 'defined')
                 | selectattr('vlan', 'equalto', item.value.vlan_id | int) | first }}
            _ppsk: "{{ (item.value.wifi_security | default('psk')) == 'ppsk' }}"
            _profile: >-
              {{ (omada_ppsk_now.json.result | default([])
                  | selectattr('profileName', 'equalto', item.value.wifi_ppsk_profile | default(''))
                  | first | default({})).id | default('') }}
          ansible.builtin.uri:
            url: "{{ omada_site }}/wireless-network/wlans/{{ omada_wlan.wlanId | default(omada_wlan.id) }}/ssids"
            method: POST
            headers: "{{ omada_hdr }}"
            body_format: json
            # A ppsk SSID is security 4 bound to its profile, and carries no key
            # of its own. It still needs the pskSetting encryption block: the
            # published schema marks pskSetting as relevant only to security 3
            # and does not list it as required, but omitting it makes the
            # controller answer errorCode -1 with no message (CHG-0005 phase 6,
            # 2026-09-15). securityKey is left out - that one really is
            # security-3 only.
            body: >-
              {{ omada_ssid_base | combine({
                   'name': item.value.wifi_ssid,
                   'guestNetEnable': item.key == 'guest',
                   'vlanId': item.value.vlan_id | int,
                   'vlanSetting': {'mode': 1, 'customConfig': {'customMode': 0, 'lanNetworkId': _net.id}}})
                 | combine({'security': 4,
                            'ppskSetting': {'ppskProfileId': _profile},
                            'pskSetting': {'versionPsk': 2, 'encryptionPsk': 3,
                                           'gikRekeyPskEnable': false}}
                           if _ppsk | bool else
                           {'pskSetting': {'securityKey': deevnet_wifi_psk[item.key], 'versionPsk': 2,
                                           'encryptionPsk': 3, 'gikRekeyPskEnable': false}}) }}
            validate_certs: false
          loop: "{{ omada_ssids_missing }}"
          loop_control:
            label: "{{ item.value.wifi_ssid }} -> VLAN {{ item.value.vlan_id }}"
          register: omada_ssid_created
          failed_when: omada_ssid_created.json.errorCode | default(-1) != 0
          no_log: true

        - name: Adopt the AP if it is pending
          when:
            - omada_adopt | bool
            - omada_ap_device.status | default(-1) == 2
          block:
            - name: Start adopting the AP with its standalone credentials
              # omada-api: documented adoptDevice spec 6.3.0.45
              ansible.builtin.uri:
                url: "{{ omada_site }}/devices/{{ omada_ap.mac }}/start-adopt"
                method: POST
                headers: "{{ omada_hdr }}"
                body_format: json
                body:
                  username: "{{ vault_wap_standalone_user }}"
                  password: "{{ vault_wap_standalone_password }}"
                validate_certs: false
              register: omada_adopt_started
              failed_when: omada_adopt_started.json.errorCode | default(-1) != 0
              no_log: true

            - name: Wait for the AP to connect
              # omada-api: documented getSiteDeviceList spec 6.3.0.45
              ansible.builtin.uri:
                url: "{{ omada_site }}/devices?page=1&pageSize=100"
                headers: "{{ omada_hdr }}"
                validate_certs: false
              register: omada_devices_now
              until: >-
                (omada_devices_now.json.result.data | selectattr('mac', 'equalto', omada_ap.mac)
                 | map(attribute='status') | first | default(-1)) == 1
              retries: "{{ (omada_adopt_timeout | int / 10) | int }}"
              delay: 10

            - name: Remember that the AP is adopted
              ansible.builtin.set_fact:
                omada_ap_device: "{{ omada_devices_now.json.result.data | selectattr('mac', 'equalto', omada_ap.mac) | first }}"

        - name: Set the AP from inventory, once it is adopted
          when: omada_ap_device.status | default(-1) == 1
          block:
            - name: Name the AP after its inventory host
              # omada-api: documented modifyGeneralConfig_2 spec 6.3.0.45
              ansible.builtin.uri:
                url: "{{ omada_site }}/aps/{{ omada_ap.mac }}/general-config"
                method: PATCH
                headers: "{{ omada_hdr }}"
                body_format: json
                body: {name: "{{ omada_ap.name }}"}
                validate_certs: false
              register: omada_ap_named
              failed_when: omada_ap_named.json.errorCode | default(-1) != 0

            - name: Give the AP its inventory address, statically
              # omada-api: documented modifyIpSettingConfig spec 6.3.0.45
              ansible.builtin.uri:
                url: "{{ omada_site }}/aps/{{ omada_ap.mac }}/ip-setting"
                method: PATCH
                headers: "{{ omada_hdr }}"
                body_format: json
                body:
                  # The controller wants a lowercase "static" here, even though the
                  # published spec's own description reads "Static; DHCP". The running
                  # controller is ground truth: "Static" is rejected with
                  # errorCode -1001 (CHG-0005, 2026-09-15). Same for "dhcp".
                  mode: static
                  staticIpSetting:
                    configIp: "{{ omada_ap.ip }}"
                    configMask: "{{ omada_ap.netmask }}"
                    configGate: "{{ omada_ap.gateway }}"
                    preferredDNS: "{{ omada_ap.dns }}"
                validate_certs: false
              register: omada_ap_ip
              failed_when: omada_ap_ip.json.errorCode | default(-1) != 0

            - name: The AP must answer at its inventory address
              ansible.builtin.wait_for:
                host: "{{ omada_ap.ip }}"
                port: 443
                timeout: 120

        - name: Verify every declared SSID is now on the controller
          # omada-api: documented getSsidList spec 6.3.0.45
          ansible.builtin.uri:
            url: "{{ omada_site }}/wireless-network/wlans/{{ omada_wlan.wlanId | default(omada_wlan.id) }}/ssids?page=1&pageSize=100"
            headers: "{{ omada_hdr }}"
            validate_certs: false
          register: omada_ssids_after
          failed_when: >-
            omada_ssids_after.json.errorCode != 0 or
            (omada_segments | map(attribute='value.wifi_ssid')
             | reject('in', omada_ssids_after.json.result.data | map(attribute='name') | list) | list | length) > 0
