---
# Configure OPNsense core router (full stack)
#
# Applies all OPNsense configuration in dependency order:
#   1. VLANs + interface IPs
#   2. Zone-based firewall rules
#   3. DNS (Unbound)
#   4. DHCP (Kea)
#   5. Gateways and static routes
#   6. The web GUI and API certificate (ADR-0030 §3; runbook: Certificates)
#
# Secrets are vaulted in inventory (group_vars/routers/vault.yml).
# Usage:
#   ansible-playbook playbooks/opnsense.yml --ask-vault-pass

- name: Configure OPNsense core router (full stack)
  hosts: dns_servers
  gather_facts: false
  roles:
    - opnsense_vlans
    - opnsense_firewall
    - opnsense_dns
    - opnsense_dhcp
    - opnsense_routes
    - role: opnsense_cert
      tags: [certs]
    # Last: the configuration as this run left it, staged for the make target
    # to seal into the inventory (make seal-backups after a raw run).
    - role: opnsense_backup
      tags: [always]
